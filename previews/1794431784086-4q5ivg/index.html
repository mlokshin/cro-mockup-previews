n       :not([data-testid]) — widget code typically carries a testid;\n         tracking pixels don't. Defence-in-depth for other vendors\n         that follow Stylitics's pattern.\n       :not([loading]) — same. Lazy-loaded content images carry\n         loading=\"lazy\" / \"eager\"; tracking beacons don't. */\n  img[width=\"1\"][height=\"1\"]:not([class*=\"stylitics\"]):not([data-testid]):not([loading]),\n  img[width=\"0\"][height=\"0\"]:not([class*=\"stylitics\"]):not([data-testid]):not([loading]) {\n    width: 1px !important;\n    height: 1px !important;\n    position: absolute !important;\n    pointer-events: none;\n  }\n\n  @font-face {\n    font-family: 'Messina Sans VF';\n    src: url('//www.bostonproper.com/cdn/shop/t/1575/assets/MessinaSans-Light.woff2?v=52620737138227856671794251955') format('woff2');\n    font-weight: 300;\n    font-style: normal;\n    font-display: swap;\n  }\n  @font-face {\n    font-family: 'Messina Sans VF';\n    src: url('//www.bostonproper.com/cdn/shop/t/1575/assets/MessinaSans-Regular.woff2?v=143903206038847021881794251955') format('woff2');\n    font-weight: 400;\n    font-style: normal;\n    font-display: swap;\n  }\n  @font-face {\n    font-family: 'Messina Sans VF';\n    src: url('//www.bostonproper.com/cdn/shop/t/1575/assets/MessinaSans-SemiBold.woff2?v=136830414853171670151794251955') format('woff2');\n    font-weight: 500 600;\n    font-style: normal;\n    font-display: swap;\n  }\n  @font-face {\n    font-family: 'Messina Sans VF';\n    src: url('//www.bostonproper.com/cdn/shop/t/1575/assets/MessinaSans-Bold.woff2?v=151736514687132566241794251955') format('woff2');\n    font-weight: 700;\n    font-style: normal;\n    font-display: swap;\n  }\n\n  @font-face {\n    font-family: 'Signifier';\n    src: url('//www.bostonproper.com/cdn/shop/t/1575/assets/Signifier-Light.woff2?v=141591112723842981461794251955') format('woff2');\n    font-weight: 300;\n    font-style: normal;\n    font-display: swap;\n  }\n  @font-face {\n    font-family: 'Signifier';\n    src: url('//www.bostonproper.com/cdn/shop/t/1575/assets/Signifier-Regular.woff2?v=76067088345373958441794251955') format('woff2');\n    font-weight: 400;\n    font-style: normal;\n    font-display: swap;\n  }\n\n  /* ============================================================\n     Boston Proper design tokens.\n\n     Single source of truth for spacing, colors, and font families\n     used by BP custom sections (bp-hero-slider, bp-shop-by-category,\n     bp-product-carousel, ...). New sections SHOULD read from these\n     tokens instead of hardcoding pixel values or hex colors. See\n     CLAUDE.md for usage conventions.\n     ============================================================ */\n  :root {\n    /* Typography — Messina Sans VF is the site-wide default body\n       family; Signifier is opt-in for display/heading copy. The five\n       Horizon font-family vars are overridden here so every section\n       inherits Messina Sans without per-section rules. */\n    --font-body--family: 'Messina Sans VF', system-ui, -apple-system, 'Segoe UI', sans-serif;\n    --font-paragraph--family: 'Messina Sans VF', system-ui, -apple-system, 'Segoe UI', sans-serif;\n    --font-subheading--family: 'Messina Sans VF', system-ui, -apple-system, 'Segoe UI', sans-serif;\n    --font-heading--family: 'Messina Sans VF', system-ui, -apple-system, 'Segoe UI', sans-serif;\n    --font-accent--family: 'Messina Sans VF', system-ui, -apple-system, 'Segoe UI', sans-serif;\n\n    --bp-font-body: 'Messina Sans VF', system-ui, -apple-system, 'Segoe UI', sans-serif;\n    --bp-font-display: 'Signifier', 'Times New Roman', serif;\n\n    /* Spacing — values below are the MOBILE defaults; the desktop\n       overrides live in the @media block at the bottom of :root. Section\n       gutter is the horizontal distance from viewport edge to content;\n       section gap is the gap between heading/nav rows or between cards\n       in a track; card gap is the gap between elements inside a single\n       card. */\n    --bp-section-pad-x: 16px;\n    --bp-section-pad-y: 32px;\n    --bp-section-gap:   16px;\n    --bp-card-gap:      12px;\n\n    /* Colors */\n    --bp-color-text:       #171609;\n    --bp-color-bg-cream:   #F7F6EA;\n    --bp-color-bg-page:    #FEFFFA;\n    --bp-color-promo:      #B5341B;\n    /* #CA3D3D was only 4.55:1 on cream (razor-thin pass). Nudged to\n       #C23636 (~5.0:1 on cream) for AA margin — imperceptibly darker red. */\n    --bp-color-sales-red:  #C23636;\n    --bp-color-cta-text:   #FDFFFA;\n    /* Sand CTA palette (Figma). Filled sand button + its inverse. Paired\n       so `--sand` and `--sand-invert` just swap fg/bg. */\n    --bp-color-cta-sand:      #E8DFD0;\n    --bp-color-cta-sand-text: #2B241A;\n    /* Body-copy grey darkened from #74736B (4.39:1 on cream / 4.14:1 on\n       neutral — failed WCAG AA 4.5:1) to #666559, which clears 4.5:1 on\n       white, cream and neutral. Disabled/OOS greys stay #74736B (exempt). */\n    --bp-color-body-copy:  #666559;\n    /* Muted/secondary ink for eyebrows, sub-labels, counts. Replaces the\n       scattered rgba(23,22,9,0.45–0.55) usages that failed WCAG AA 4.5:1\n       (~3.0–4.05:1). 0.65 ≈ 4.9:1 on white/cream. */\n    --bp-color-text-muted: rgba(23, 22, 9, 0.65);\n    --bp-color-neutral:    #F0EFEA;\n\n    /* Type scale — single source for the sizes already used across the\n       BP sections. Mobile values live here; desktop overrides are in the\n       @media block below. Consumed by the .bp-fs-* utility classes and\n       by the shared blocks (_bp-heading, _bp-body). */\n    --bp-fs-h1: 36px;  /* hero / page lead (mobile of clamp(36,6vw,50)) */\n    --bp-fs-h2: 32px;  /* section title (matches bp-fc/bp-itb/bp-grid mobile) */\n    --bp-fs-h3: 28px;\n    --bp-fs-h4: 24px;\n    --bp-fs-h5: 20px;\n    --bp-fs-h6: 16px;\n\n    --bp-fs-body-lg: 17px; /* eyebrows + lead descriptions */\n    --bp-fs-body-md: 14px; /* default body copy */\n    --bp-fs-body-sm: 13px; /* fine print / meta */\n    --bp-fs-body-xs: 12px; /* micro labels */\n  }\n\n  /* Desktop spacing + type-scale overrides — single point of truth for\n     the breakpoint where the BP layout shifts from mobile-compact to\n     desktop-roomy. */\n  @media screen and (min-width: 1024px) {\n    :root {\n      --bp-section-pad-x: 40px;\n      --bp-section-pad-y: 40px;\n      --bp-section-gap:   20px;\n\n      --bp-fs-h1: 50px;  /* hero */\n      --bp-fs-h2: 40px;  /* section title (bp-fc h1 variant / bp-itb desktop) */\n      --bp-fs-h3: 32px;  /* sub-section */\n      --bp-fs-h4: 24px;\n      --bp-fs-h5: 20px;\n      --bp-fs-h6: 18px;\n    }\n  }\n\n  /* Type-scale utility classes — apply just the size + tracking +\n     leading. Family/colour come from the wrapping element so the same\n     scale step works for display (Signifier) and body (Messina) copy. */\n  .bp-fs-h1 { font-size: var(--bp-fs-h1); letter-spacing: -0.02em; line-height: 110%; }\n  .bp-fs-h2 { font-size: var(--bp-fs-h2); letter-spacing: -0.02em; line-height: 115%; }\n  .bp-fs-h3 { font-size: var(--bp-fs-h3); letter-spacing: -0.02em; line-height: 120%; }\n  .bp-fs-h4 { font-size: var(--bp-fs-h4); letter-spacing: -0.01em; line-height: 125%; }\n  .bp-fs-h5 { font-size: var(--bp-fs-h5); line-height: 130%; }\n  .bp-fs-h6 { font-size: var(--bp-fs-h6); line-height: 135%; }\n\n  .bp-fs-body-lg { font-size: var(--bp-fs-body-lg); line-height: 150%; }\n  .bp-fs-body-md { font-size: var(--bp-fs-body-md); line-height: 145%; }\n  .bp-fs-body-sm { font-size: var(--bp-fs-body-sm); line-height: 145%; }\n  .bp-fs-body-xs { font-size: var(--bp-fs-body-xs); line-height: 145%; }\n\n  /* Topnav alignment: pin the header rows and announcement bar to the\n     same 40px gutter as the BP custom sections.\n\n     Horizon's section system uses a 3-column grid:\n       minmax(--page-margin, 1fr)\n       --full-page-grid-central-column-width  (clamped to --page-content-width = 1440px)\n       minmax(--page-margin, 1fr)\n     On viewports wider than ~1520px the side tracks grow above\n     --page-margin to center the 1440px content column. So overriding\n     --page-margin alone keeps the side tracks at 40px MIN but they\n     still expand on wide screens. We also override the central column\n     to \"100% - 80px\" so the 1fr side tracks collapse to exactly the\n     40px minimum on every viewport, regardless of width. */\n  .header__row,\n  .announcement-bar {\n    --page-margin: var(--bp-section-pad-x);\n    --full-page-grid-central-column-width: calc(100% - var(--bp-section-pad-x) * 2);\n  }\n\n  /* Mobile header — keep the right-side icons (search / wishlist /\n     bag) inside the viewport on narrow widths (≤749px). The BP\n     logo is an inline SVG (bp-logo.svg) rendered with a fixed\n     --header-logo-image-width-mobile: 198px via inline style on\n     the wrapper span. Combined with 4 × ~44px bookend cells that\n     hold the hamburger / search / wishlist / bag, the total width\n     hits 374px which is iPhone X (375px) viewport width — leaving\n     no room for the bag icon. Cap the SVG container width with\n     clamp() so the logo scales down on narrow viewports while\n     staying close to 198px once there's enough room for it. */\n  @media screen and (max-width: 749px) {\n    .header__row .header-logo {\n      min-width: 0;\n      max-width: 100%;\n      overflow: hidden;\n    }\n    .header__row .header-logo__image,\n    .header__row .header-logo__image--svg {\n      width: clamp(140px, 42vw, 198px);\n      height: auto;\n      max-width: 100%;\n    }\n    .header__row .header-logo__image--svg svg {\n      width: 100%;\n      height: auto;\n      max-width: 100%;\n      display: block;\n    }\n\n    /* The scroll-logo variant (small icon-only mark, \"Header\n       scroll-logo swap\") must NOT be clamped up to wordmark width.\n       It shares the .header-logo__image / .header-logo__image--svg\n       classes with the original/inverse wordmark above, so the\n       generic rule clamps it to 140-198px too. 44x44 (to match the\n       right-side action icon hit area) looked oversized/misaligned\n       in practice — 30x30 reads closer to the intended mark size\n       while still being bigger than the original 23x18px inline\n       value baked into blocks/_header-logo.liquid. object-fit:\n       contain (images) / SVG's default preserveAspectRatio (inline\n       fallback mark) keep the artwork itself from distorting. */\n    .header__row .header-logo__image-container--scroll .header-logo__image,\n    .header__row .header-logo__image-container--scroll .header-logo__image--svg {\n      width: 30px;\n      height: 30px;\n      max-width: none;\n    }\n\n    .header__row .header-logo__image-container--scroll .header-logo__image--svg svg {\n      width: 100%;\n      height: 100%;\n      max-width: none;\n    }\n\n    /* Nudge to correct residual vertical misalignment of the scroll\n       mark that flex-centering alone didn't fully resolve (mobile\n       compact bar only — the original/inverse wordmark is unaffected\n       since this is scoped to data-bp-nav='compact'). */\n    #header-component[data-bp-nav='compact'] .header__row .header-logo {\n      padding-bottom: 6px;\n    }\n  }\n\n  /* Announcement bar slide alignment.\n\n     Horizon ships `.text-block--align-center` (and -left / -right)\n     that set `--text-align: center` on the slide as a CSS variable,\n     plus an inline `--text-align: center` from the schema, but no\n     rule in `.text-block` actually consumes it back into the\n     text-align property — only `.button` does. So the alignment\n     class + inline var are inert without this consumer.\n\n     Apply text-align: var(--text-align) on the slide + paragraph so\n     the schema's alignment choice takes effect. Defaults to center,\n     which matches the design and is what the BP announcement bar\n     always wants regardless of theme settings. */\n  .announcement-bar__slide,\n  .announcement-bar__text {\n    text-align: var(--text-align, center);\n  }\n\n  /* Announcement bar pause/play control (Atlas parity). Pinned to the\n     right edge of the bar; inherits the bar's text color. The button is\n     rendered by sections/header-announcements.liquid and wired to\n     Horizon's announcement-bar-component pause()/play(). */\n  .bp-announcement-playpause {\n    position: absolute;\n    right: 10px;\n    top: 50%;\n    transform: translateY(-50%);\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 28px;\n    height: 28px;\n    padding: 0;\n    background: transparent;\n    border: 0;\n    color: var(--color-foreground, currentColor);\n    cursor: pointer;\n    opacity: 0.75;\n    transition: opacity 0.15s ease;\n  }\n  .bp-announcement-playpause:hover { opacity: 1; }\n  /* Show exactly ONE glyph, reflecting the bar's actual state: the PAUSE bars\n     while playing (click to pause), the PLAY triangle while paused (click to\n     play). Driven off the bar's `[paused]` attribute so it stays correct\n     through Horizon's re-render of the bar (which reset the JS `hidden` toggle,\n     leaving both — or the wrong — icon showing). `!important` to beat the\n     cascade rule that was overriding the play SVG's `hidden` (QA 7/27). */\n  .bp-announcement-playpause .bp-announcement-playpause__pause { display: block !important; }\n  .bp-announcement-playpause .bp-announcement-playpause__play  { display: none  !important; }\n  announcement-bar-component[paused] .bp-announcement-playpause__pause { display: none  !important; }\n  announcement-bar-component[paused] .bp-announcement-playpause__play  { display: block !important; }\n  /* The play/pause is pinned at the bar's right edge (right:10px), and\n     Horizon's next carat also lands at the right edge (slideshow-arrows is\n     `inset:0` with `justify-content:space-between`), so the two overlap —\n     on desktop AND mobile (QA 7/27, Adrienne). Pull the arrow track's right\n     edge in past the button so the next carat sits just left of it — Atlas\n     order: […slides] [next] [play/pause]. Only the next arrow moves (the prev\n     stays at left via space-between); the centered slide text is a separate\n     element and is unaffected. */\n  .announcement-bar slideshow-arrows { right: 40px; }\n\n  /* a11y (WCAG 2.1.1): keep the desktop mega-menu submenu open while\n     keyboard focus is inside it. Horizon only reveals it on\n     [aria-expanded='true'] + :hover (blocks/_header-menu.liquid:422), so\n     tabbing into the panel could collapse it if the trigger's blur fires\n     /deactivate before focus lands. Mirrors the :hover rule for focus. */\n  .menu-list__submenu:focus-within {\n    --submenu-content-opacity: 1;\n    visibility: visible;\n  }\n\n  /* Keyboard-only down caret on top-level mega-menu items (menubar pattern —\n     Alfred 7/27). Shown when a trigger is focused via the keyboard\n     (:focus-visible) so keyboard users get a clear \"opens a submenu\"\n     affordance; mouse hover/click never shows it. The caret is a CSS triangle\n     in the link's own colour. bp-mega-hover.js wires the menubar behaviour\n     (Enter/Space/ArrowDown opens, arrows navigate, Escape/Tab close). */\n  .menu-list__list-item.bp-menu-item-li > .menu-list__link[aria-haspopup='true'] {\n    position: relative;\n  }\n  .menu-list__list-item.bp-menu-item-li > .menu-list__link[aria-haspopup='true']:focus-visible::after {\n    content: \"\";\n    position: absolute;\n    left: 50%;\n    /* Centered just BELOW the label rather than inline after it — the inline\n       caret overlapped the (fixed-min-width, centered) nav text (QA 7/27). */\n    top: calc(50% + 0.85em);\n    transform: translate(-50%, -50%);\n    width: 0;\n    height: 0;\n    border-inline: 4px solid transparent;\n    border-top: 5px solid currentColor;\n    pointer-events: none;\n  }\n\n  /* Off-white page background (#FEFFFA, Figma spec) applied GLOBALLY —\n     every template, not just index/collection (PDPs etc. were falling\n     back to Horizon's default white). Sections that paint their own bg\n     (cream bands, color schemes) still win over the body. The nav header\n     rows are overridden to match. The announcement bar is intentionally\n     NOT included — it's driven by its own merchant color scheme\n     (header-announcements.liquid), and forcing off-white would erase a\n     colored/dark promo bar. */\n  body {\n    background-color: var(--bp-color-bg-page);\n  }\n  .header,\n  .header__row,\n  .header-wrapper {\n    background-color: var(--bp-color-bg-page);\n  }\n\n  /* QA 7/16 — the Figma page color is off-white #FEFFFA, not pure white.\n     Horizon's DEFAULT color scheme (scheme-1) paints #ffffff, and that's\n     what the PDP main sections, the header, and the mega-menu read through\n     --color-background — so those surfaces stayed white despite the body\n     override above. Remap just the white scheme to the BP page-bg token so\n     every scheme-1 surface (all pages that use the default scheme) goes\n     off-white. bp-fonts renders AFTER color-schemes in theme.liquid, so this\n     wins on equal specificity without !important. The other schemes\n     (grey #f5f5f5, cream #eef1ea, blue, dark) are intentional — left alone. */\n  .color-scheme-1 {\n    --color-background: var(--bp-color-bg-page);\n    --color-background-rgb: 254, 255, 250;\n  }\n\n  /* ============================================================\n     BP Product Drawer — re-skin Horizon's quick-add modal as a\n     right-side slide-in drawer.\n\n     MOVED to assets/bp-fonts-deferred.css (loaded non-render-\n     blocking from theme.liquid). The drawer is a native <dialog\n     class=\"quick-add-modal\"> that is UA display:none until a card\n     click opens it — an interaction-revealed surface — so its\n     open/appearance rules don't need to block first paint. Horizon's\n     own base .quick-add-modal styles stay render-blocking and keep\n     the dialog functional. See CLAUDE.md \"Topnav 40px gutter\" note\n     for the specificity-bumping pattern the moved rules use.\n     ============================================================ */\n\n  /* ============================================================\n     BP product card — shared by bp-product-carousel and bp-collection\n     (PLP). Lives here (not in either section) because both surfaces\n     need the styles, and CSS in a section stylesheet block only loads\n     when that section is rendered.\n     ============================================================ */\n  .bp-card-host { display: contents; }\n\n  .bp-card {\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    gap: var(--bp-card-gap);\n    color: var(--bp-color-text);\n  }\n\n  .bp-card__media {\n    position: relative;\n    display: block;\n    aspect-ratio: 3 / 4;\n    overflow: hidden;\n    background: var(--bp-color-bg-cream);\n    color: inherit;\n  }\n  .bp-card__media-link {\n    position: absolute;\n    inset: 0;\n    display: block;\n    text-decoration: none;\n    color: inherit;\n  }\n  .bp-card__quick-add {\n    position: absolute;\n    width: 1px;\n    height: 1px;\n    overflow: hidden;\n    clip: rect(0 0 0 0);\n    pointer-events: none;\n  }\n  .bp-card__image {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    display: block;\n    transition: opacity 0.4s ease;\n  }\n  .bp-card__image--secondary { opacity: 0; }\n  /* Hover-swap default: when the merchant turns secondary-hover off\n     via the §9.4 setting, the secondary image stays hidden.\n     The primary only fades out when a secondary image is actually\n     present (`:has(.bp-card__image--secondary)`). Single-image\n     products (many Collective / Hanky Panky items) render no secondary\n     element, so without this guard the primary faded to opacity 0 on\n     hover and the card went BLANK — hover must keep showing the first\n     image when there's nothing to swap to (QA 7/31). */\n  @media (hover: hover) {\n    .bp-card[data-bp-card-secondary-hover='true'] .bp-card__media:has(.bp-card__image--secondary):hover .bp-card__image--primary { opacity: 0; }\n    .bp-card[data-bp-card-secondary-hover='true'] .bp-card__media:hover .bp-card__image--secondary { opacity: 1; }\n  }\n\n  .bp-card__badges {\n    position: absolute;\n    top: 12px;\n    left: 12px;\n    z-index: 2;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-start;\n    gap: 6px;\n  }\n\n  .bp-card__badge {\n    background: var(--bp-color-bg-cream);\n    color: var(--bp-color-text);\n    padding: 4px 10px;\n    font-family: var(--bp-font-display);\n    font-size: 14px;\n    font-style: normal;\n    font-weight: 300;\n    line-height: 120%;\n    letter-spacing: -0.28px;\n  }\n\n  .bp-card__quick {\n    position: absolute;\n    bottom: 12px;\n    right: 12px;\n    z-index: 2;\n    width: 36px;\n    height: 36px;\n    border-radius: 0;\n    border: 1px solid rgba(23, 22, 9, 0.15);\n    background: var(--bp-color-bg-page);\n    color: var(--bp-color-text);\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    cursor: pointer;\n    opacity: 0;\n    transform: translateY(4px);\n    transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s ease;\n  }\n  .bp-card__quick:hover { background: var(--bp-color-text); color: #fff; }\n\n  /* Quick-drawer gallery nav (.bp-qd-gallery-nav) is injected by JS onto\n     <bp-pdp-gallery>. Its positioning/flip styles live inside a mobile\n     @media block scoped to .bp-qd__media-slot, so on desktop — or when the\n     gallery is the main PDP gallery (not in the drawer) — the buttons fall\n     to the bottom unstyled: two disabled, both-right-pointing arrows. Hide\n     the nav globally by default; bp-quick-drawer's mobile rules re-show it\n     inside the drawer media slot. */\n  .bp-qd-gallery-nav { display: none; }\n\n  /* Quick-view button visibility — driven by §9.4 setting keys.\n     \"Always\" applies on any device (logically: always = always);\n     \"Hover\" only fires on hover-capable devices. Mobile show/hide\n     is keyed on (hover: none) so it doesn't fight the desktop rules\n     on touch laptops that report (hover: hover). */\n\n  /* \"Always visible\" — opt-out of the hover-reveal animation. */\n  .bp-card[data-bp-card-qv-vis-d='always'] .bp-card__quick {\n    opacity: 1;\n    transform: none;\n  }\n\n  /* Hover-capable devices: hover-to-reveal (default for desktop). */\n  @media (hover: hover) {\n    .bp-card[data-bp-card-qv-vis-d='hover'] .bp-card__media:hover .bp-card__quick {\n      opacity: 1;\n      transform: translateY(0);\n    }\n  }\n\n  /* Keyboard: reveal when the bag (or any focusable control in the card)\n     receives focus. */\n  .bp-card[data-bp-card-qv-vis-d='hover']:focus-within .bp-card__quick {\n    opacity: 1;\n    transform: translateY(0);\n  }\n\n  /* Touch-only: explicit mobile show/hide. */\n  @media (hover: none) {\n    .bp-card[data-bp-card-qv-vis-m='shown'] .bp-card__quick {\n      opacity: 1;\n      transform: none;\n    }\n    .bp-card[data-bp-card-qv-vis-m='hidden'] .bp-card__quick {\n      display: none;\n    }\n  }\n\n  /* Whole-product trigger style — make the card surface look clickable\n     and remove the bag-icon affordance. The bag itself isn't rendered\n     in this mode (see bp-product-card.liquid), so this just signals\n     interactivity. */\n  .bp-card[data-bp-card-qb-style='whole_product'] {\n    cursor: pointer;\n  }\n\n  /* Swatch host wrapper — passes through for layout; the click target\n     is the inner `.swatch` element (Horizon's). */\n  .bp-card__swatch-host { display: inline-flex; cursor: pointer; }\n\n  .bp-card__body {\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n  }\n  .bp-card__collection {\n    margin: 0;\n    font-family: var(--bp-font-body);\n    font-size: 11px;\n    font-weight: 500;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--bp-color-text-muted);\n    line-height: 1.3;\n  }\n  .bp-card__title {\n    margin: 0;\n    font-family: var(--bp-font-body);\n    font-size: 15px;\n    font-weight: 400;\n    line-height: 1.3;\n    letter-spacing: -0.15px;\n  }\n  .bp-card__title a {\n    color: inherit;\n    text-decoration: none;\n  }\n  .bp-card__title a:hover { text-decoration: underline; text-underline-offset: 3px; }\n\n  .bp-card__price-row {\n    display: flex;\n    flex-wrap: wrap;\n    align-items: baseline;\n    gap: 6px 10px;\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    font-weight: 500;\n    line-height: 145%;\n    letter-spacing: -0.14px;\n  }\n  .bp-card__price {\n    color: var(--bp-color-text, #171609);\n    font-weight: 500;\n  }\n  .bp-card__compare {\n    /* Strikethrough/compare price grey — #74736B, matching the PDP\n       (bp-pdp-styles .compare-at-price) per QA (Amber). NB: #74736B is the\n       WCAG-exempt grey (it fails AA 4.5:1); kept consistent with the PDP at\n       the team's request over the darker --bp-color-body-copy (#666559). */\n    color: #74736B;\n    text-decoration: line-through;\n    font-weight: 500;\n  }\n  .bp-card__promo {\n    color: #CA3D3D;\n    font-size: 12px;\n    font-weight: 400;\n    line-height: 145%;\n    letter-spacing: -0.12px;\n    flex-basis: 100%;\n  }\n  /* Desktop: try to sit inline with the price; when it doesn't fit,\n     flex-wrap pushes it to the next line. No margin-left:auto here\n     — that would right-align the wrapped copy. Plain flex-grow:0\n     keeps it hugging the price on the same line. */\n  @media screen and (min-width: 1024px) {\n    .bp-card__promo {\n      flex-basis: auto;\n      margin-left: 0;\n      text-align: left;\n    }\n  }\n\n  .bp-card__swatches {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    margin: 8px 0 0;\n    padding: 4px;\n    list-style: none;\n  }\n  .bp-card__swatch-item {\n    display: inline-flex;\n    align-items: center;\n    position: relative;\n  }\n  /* Sale-discount badge on a swatch — Body/Semi/Tiny spec:\n     Messina 10 / 660 / 145% / -0.1px, Sales-Red on white with a\n     red border. Anchors top-right of the swatch dot. */\n  .bp-card__swatch-discount {\n    position: absolute;\n    top: -6px;\n    right: -8px;\n    display: inline-flex;\n    flex-direction: column;\n    justify-content: center;\n    align-items: center;\n    padding: 0 2px;\n    border: 1px solid #CA3D3D;\n    background: #FDFFFA;\n    color: #CA3D3D;\n    text-align: center;\n    font-family: var(--bp-font-body);\n    font-size: 10px;\n    font-weight: 700;\n    line-height: 145%;\n    letter-spacing: -0.1px;\n    pointer-events: none;\n    white-space: nowrap;\n  }\n  /* BP a11y: interactive swatches are a <button> wrapping a decorative\n     <img>. The button is a transparent wrapper (focus ring only) — the\n     visual ring stays on .bp-card__swatch-img so the many bare-<span>\n     swatch renderers (Bloomreach cards/carousel, search, you'll-also-love)\n     keep it without needing the button. */\n  .bp-card__swatch {\n    appearance: none;\n    -webkit-appearance: none;\n    padding: 0;\n    border: 0;\n    background: transparent;\n    border-radius: 50%;\n    cursor: pointer;\n    display: block;\n    line-height: 0;\n    flex-shrink: 0;\n  }\n  .bp-card__swatch:focus-visible {\n    outline: 2px solid var(--bp-color-text);\n    outline-offset: 4px;\n  }\n  .bp-card__swatch-img {\n    width: 24px;\n    height: 24px;\n    border-radius: 50%;\n    object-fit: cover;\n    display: block;\n    flex-shrink: 0;\n    /* 2px white gap + 1px cream ring — layered box-shadow keeps\n       the element size stable while painting the ring outside the image. */\n    box-shadow: 0 0 0 2px #fff, 0 0 0 3px #E1E0D4;\n  }\n  /* Design-preview mock dot — solid background color, no image,\n     same 23px footprint as the real swatch. */\n  .bp-card__swatch-img--mock {\n    background-clip: content-box;\n    background-size: cover;\n    border-color: rgba(23, 22, 9, 0.15);\n  }\n  /* Active ring targets the visible dot whether the active class sits on\n     the button (bp-product-card / bp-card-hydrate) or directly on the img\n     (bare-span renderers). */\n  .bp-card__swatch--active .bp-card__swatch-img,\n  .bp-card__swatch-img.bp-card__swatch--active {\n    box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--bp-color-text);\n  }\n  .bp-card__swatch-more {\n    font-family: var(--bp-font-body);\n    font-size: 12px;\n    color: rgba(23, 22, 9, 0.65);\n    margin-left: 2px;\n  }\n  /* +N is now a PDP link — keep it visually identical to the old text\n     (inherit colour, no underline) but tappable, with a hover cue. */\n  .bp-card__swatch-more-link {\n    color: inherit;\n    text-decoration: none;\n  }\n  .bp-card__swatch-more-link:hover { text-decoration: underline; text-underline-offset: 2px; }\n\n  /* ============================================================\n     BP Shop-the-Look drawer — global styles.\n\n     MOVED to assets/bp-fonts-deferred.css (loaded non-render-\n     blocking from theme.liquid). `.bp-stl-drawer` is a native\n     <dialog> (UA display:none until .showModal() opens it from a\n     \"Shop the look\" trigger) — an interaction-revealed surface with\n     no closed-state hide rule of its own — so its appearance rules\n     don't need to block first paint. Markup: snippets/\n     bp-stl-drawer.liquid; behavior: assets/bp-stl-drawer.js.\n     ============================================================ */\n\n  /* ============================================================\n     BP Footer utilities bar — override Horizon's footer-utilities\n     so the bottom copyright / policy bar inherits the cream\n     background that bp-footer uses, and the link color stays on-brand.\n     ============================================================ */\n  .footer-utilities {\n    background-color: var(--bp-color-bg-cream);\n    color: var(--bp-color-text);\n  }\n  .footer-utilities a {\n    color: var(--bp-color-text);\n  }\n\n  /* ============================================================\n     BP Mega Menu (desktop) — markup lives in blocks/_bp-menu-item.liquid.\n     Horizon already handles submenu positioning, hover open/close,\n     and the <header-menu> layout. We only add: vertical centering of\n     the menu row + the .bp-mega* content styles for the dropdown.\n     ============================================================ */\n\n  /* Vertically center menu items in the header row */\n  header-menu .menu-list,\n  .menu-list {\n    align-items: center;\n  }\n\n  /* Top-level nav links — smooth hover transitions.\n     Uses Messina Sans VF (variable font) so font-weight can transition\n     smoothly via font-variation-settings rather than snapping. Plus a\n     gentle underline that grows from the center under each label. */\n  .menu-list__list-item .menu-list__link {\n    position: relative;\n    transition: opacity 0.2s ease, font-variation-settings 0.25s ease;\n    font-variation-settings: 'wght' 400;\n  }\n  .menu-list__list-item .menu-list__link::after {\n    content: '';\n    position: absolute;\n    left: 50%;\n    bottom: 0;\n    width: 0;\n    height: 1px;\n    background: currentColor;\n    transform: translateX(-50%);\n    transition: width 0.25s ease;\n    pointer-events: none;\n  }\n  .menu-list__list-item:hover .menu-list__link,\n  .menu-list__list-item:focus-within .menu-list__link,\n  .menu-list__list-item.bp-menu-open .menu-list__link,\n  .menu-list__list-item .menu-list__link[aria-expanded='true'],\n  .menu-list__list-item .menu-list__link.menu-list__link--active {\n    font-weight: 700;\n    font-variation-settings: 'wght' 700;\n  }\n  .menu-list__list-item:hover .menu-list__link::after,\n  .menu-list__list-item:focus-within .menu-list__link::after,\n  .menu-list__list-item.bp-menu-open .menu-list__link::after {\n    width: 100%;\n  }\n  /* Sibling fade — when one nav item is hovered/open, gently dim the others */\n  .menu-list:hover .menu-list__list-item .menu-list__link,\n  .menu-list:has(.bp-menu-open) .menu-list__list-item .menu-list__link {\n    opacity: 0.55;\n  }\n  .menu-list:hover .menu-list__list-item:hover .menu-list__link,\n  .menu-list .menu-list__list-item.bp-menu-open .menu-list__link,\n  .menu-list .menu-list__list-item:focus-within .menu-list__link {\n    opacity: 1;\n  }\n\n  /* BP mega submenu — own classes (.bp-mega-submenu, not Horizon's\n     .menu-list__submenu) so Horizon's submenu CSS doesn't apply. Open/\n     close is driven by .bp-menu-open on the LI, set by our JS hover\n     handler (assets/bp-mega-hover.js) with a debounced close. */\n  .bp-mega-submenu {\n    position: fixed;\n    left: 0;\n    right: 0;\n    top: var(--header-height, 60px);\n    width: 100vw;\n    max-width: 100vw;\n    z-index: 90;\n    /* Off-white to match the header (QA 7/16) — falls back to the BP page\n       bg token, not #fff, if --color-background is ever unset. */\n    background: var(--color-background, var(--bp-color-bg-page));\n    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 0.15s ease;\n  }\n  .menu-list__list-item.bp-menu-open > .bp-mega-submenu {\n    opacity: 1;\n    pointer-events: auto;\n  }\n  .bp-mega-submenu__inner {\n    width: 100%;\n    /* CLAUDE.md spacing tokens — match the rest of the BP sections.\n       Top is 20px (a touch tight against the nav row); sides + bottom\n       use the standard --bp-section-pad-x / -y so the content's left\n       edge aligns with the logo (which sits at --bp-section-pad-x via\n       the topnav --page-margin override in this same file). No\n       max-width / centering — full-bleed minus gutters. */\n    padding: 20px var(--bp-section-pad-x) var(--bp-section-pad-y);\n    box-sizing: border-box;\n  }\n\n  /* Layout: columns + (optional) right-side promos. Uses BP spacing\n     tokens (CLAUDE.md): --bp-section-gap = 20px desktop. */\n  .bp-mega {\n    display: flex;\n    align-items: flex-start;\n    gap: var(--bp-section-gap);\n    align-self: stretch;\n    width: 100%;\n    white-space: normal;\n    word-wrap: break-word;\n    overflow-wrap: break-word;\n    font-family: var(--font-body--family);\n    font-size: var(--font-size--sm);\n    line-height: 1.4;\n    color: var(--color-foreground);\n  }\n  .bp-mega *, .bp-mega *::before, .bp-mega *::after { white-space: normal; }\n\n  /* Columns side-by-side, equal width, BP spacing */\n  .bp-mega__columns {\n    flex: 1 1 auto;\n    display: flex;\n    gap: var(--bp-section-gap);\n  }\n  .bp-mega__column {\n    flex: 1 1 0;\n    min-width: 0;\n  }\n\n  .bp-mega__column {\n    display: flex;\n    flex-direction: column;\n    gap: var(--gap-sm);\n    min-width: 0;\n  }\n  /* Column / tab heading — Body/Semi/Small (Messina Sans VF, 14px, 660). */\n  .bp-mega__heading {\n    margin: 0 0 var(--bp-card-gap);\n    color: var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    font-style: normal;\n    font-weight: 700;\n    line-height: 145%;\n    letter-spacing: -0.14px;\n  }\n  .bp-mega__heading a { color: inherit; text-decoration: none; }\n\n  .bp-mega__links {\n    list-style: none;\n    margin: 0;\n    padding: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n  }\n  .bp-mega__links a {\n    font-family: var(--font-body--family);\n    font-size: var(--font-size--sm);\n    color: var(--color-foreground);\n    text-decoration: none;\n    line-height: 1.4;\n  }\n  .bp-mega__links a:hover { text-decoration: underline; }\n\n  .bp-mega__promos {\n    flex: 0 0 auto;\n    /* Pin to the right edge of the dropdown (just inside the\n       --bp-section-pad-x gutter). margin-inline-start:auto pushes us\n       past the columns regardless of how much space they take. */\n    margin-inline-start: auto;\n    display: grid;\n    /* Default = two fixed-width columns. The :has(:only-child) rule\n       below swaps to a single wider column when only one promo\n       renders. Was repeat(auto-fit, 220px), but auto-fit would\n       collapse to a single column on dropdowns where the menu\n       columns squeezed this container narrow — making the second\n       promo wrap below the first instead of sitting beside it. */\n    grid-template-columns: repeat(2, 220px);\n    gap: var(--bp-section-gap);\n    justify-content: end;\n  }\n  .bp-mega__promo { min-width: 0; max-width: 100%; }\n  .bp-mega__promo-link {\n    display: flex;\n    flex-direction: column;\n    gap: var(--gap-xs);\n    text-decoration: none;\n    color: var(--color-foreground);\n    width: 100%;\n  }\n  .bp-mega__promo-image {\n    position: relative;\n    width: 100%;\n    aspect-ratio: 4 / 5;\n    background: var(--color-foreground-muted, #ddd);\n    overflow: hidden;\n  }\n  .bp-mega__promo-image svg,\n  .bp-mega__promo-image img,\n  .bp-mega__promo-video {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    display: block;\n  }\n\n  /* Promo typography — Messina Sans VF semi (660) for the title;\n     500 for the body copy. Colors: Black for title, --bp-color-body-copy\n     (#74736B) for the supporting paragraph. */\n  .bp-mega__promo-title {\n    margin: 0;\n    color: var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    font-style: normal;\n    font-weight: 700;\n    line-height: 145%;\n    letter-spacing: -0.14px;\n  }\n  .bp-mega__promo-copy {\n    margin: 0;\n    color: var(--bp-color-body-copy);\n    font-family: var(--bp-font-body);\n    font-size: 12px;\n    font-style: normal;\n    font-weight: 500;\n    line-height: 145%;\n    letter-spacing: -0.12px;\n  }\n  .bp-mega__promo-cta {\n    margin-top: 4px;\n    color: var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 12px;\n    font-weight: 500;\n    line-height: 145%;\n    letter-spacing: -0.12px;\n    text-decoration: underline;\n    text-underline-offset: 3px;\n  }\n\n  /* Single-promo variant: when only one promo is rendered inside a\n     columns_promos dropdown, give it the width of two regular promos\n     (~460px) and a 3:2 landscape image, capped at 370px tall. Driven\n     by :only-child so no Liquid changes needed. */\n  .bp-mega__promos:has(> .bp-mega__promo:only-child) {\n    grid-template-columns: minmax(0, 460px);\n  }\n  .bp-mega__promos > .bp-mega__promo:only-child .bp-mega__promo-image {\n    aspect-ratio: 3 / 2;\n    height: 370px;\n    width: 100%;\n    align-self: stretch;\n  }\n\n  @media screen and (max-width: 989px) {\n    .bp-mega--columns-promos { flex-direction: column; }\n    .bp-mega__promos { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  }\n\n  /* ----- Layout: image_tiles (Occasions) ----------------------------\n     Flat row of tiles. Each tile = square image + title + Shop Now.\n     Tile width is fluid; on tighter widths the row wraps. Designed\n     to lay out 6 tiles in one row at desktop widths. */\n  .bp-mega--image-tiles { display: block; }\n  .bp-mega__tiles {\n    display: grid;\n    grid-template-columns: repeat(6, minmax(0, 1fr));\n    gap: var(--bp-section-gap);\n    width: 100%;\n  }\n  @media screen and (max-width: 1279px) {\n    .bp-mega__tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n  }\n  @media screen and (max-width: 989px) {\n    .bp-mega__tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n  }\n  .bp-mega__tile {\n    display: flex;\n    flex-direction: column;\n    gap: var(--bp-card-gap);\n    color: var(--bp-color-text);\n    text-decoration: none;\n  }\n  .bp-mega__tile-image {\n    position: relative;\n    aspect-ratio: 1 / 1;\n    background: var(--bp-color-bg-cream);\n    overflow: hidden;\n  }\n  /* Image-tiles layout ONLY: 4/5 portrait per the wireframe — the square\n     (1/1) cropped the imagery (Ernie 7/27). Scoped to the image_tiles\n     container so other mega layouts are unaffected. The <img> still\n     object-fit:covers this box. */\n  .bp-mega--image-tiles .bp-mega__tile-image {\n    aspect-ratio: 4 / 5;\n  }\n  .bp-mega__tile-image img,\n  .bp-mega__tile-image svg {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    display: block;\n  }\n  .bp-mega__tile-title {\n    margin: 0;\n    font-family: var(--bp-font-body);\n    font-size: 15px;\n    font-weight: 500;\n    line-height: 1.3;\n    letter-spacing: -0.15px;\n    color: var(--bp-color-text);\n  }\n  .bp-mega__tile-cta {\n    font-family: var(--bp-font-body);\n    font-size: 13px;\n    line-height: 1.4;\n    color: var(--bp-color-text);\n    text-decoration: underline;\n    text-underline-offset: 3px;\n  }\n\n  /* ----- Layout: tabs_promos (Brands We Love) -----------------------\n     3-column grid: vertical tab list | active panel | promos.\n     Tab activation is handled by assets/bp-mega-hover.js (initTabs). */\n  .bp-mega--tabs-promos { display: block; }\n  .bp-mega__tabs {\n    display: grid;\n    grid-template-columns: minmax(180px, 1fr) minmax(0, 2fr) minmax(0, 2fr);\n    gap: var(--bp-section-gap);\n    width: 100%;\n    align-items: start;\n  }\n  .bp-mega__tabs-list {\n    list-style: none;\n    margin: 0;\n    padding: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n  }\n  .bp-mega__tab {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    width: 100%;\n    padding: 14px 16px;\n    background: transparent;\n    border: 0;\n    cursor: pointer;\n    text-align: left;\n    color: var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    line-height: 1.3;\n    letter-spacing: -0.14px;\n    transition: background-color 0.15s ease, font-weight 0.15s ease;\n  }\n  .bp-mega__tab:hover {\n    background: var(--bp-color-neutral);\n  }\n  .bp-mega__tab.is-active {\n    background: var(--bp-color-neutral);\n    font-weight: 600;\n  }\n  .bp-mega__tab-chevron {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    flex: 0 0 auto;\n    margin-left: 12px;\n    opacity: 0.85;\n    /* New chevron asset is drawn left-pointing; flip to point right\n       (toward the tab panel that opens on the right). */\n    transform: scaleX(-1);\n  }\n  .bp-mega__tabs-panels {\n    min-width: 0;\n  }\n  .bp-mega__tab-panel {\n    display: none;\n    padding: 4px 0;\n  }\n  .bp-mega__tab-panel.is-active {\n    display: block;\n  }\n  /* Tabs layout uses a slightly looser link gap (8px vs 6px elsewhere). */\n  .bp-mega--tabs-promos .bp-mega__links {\n    gap: 8px;\n  }\n  /* Two-column tab links (merchant toggle: block.settings.tabs_link_columns).\n     Long lists like Brands We Love overflow one tall column and leave the\n     right half of the panel empty; splitting into two balanced columns uses\n     that white space beside the promos. Give the panel track more room (3fr)\n     so both columns breathe, then flow the <ul> as CSS multi-column — items\n     fill top-to-bottom of column 1, then column 2, which keeps an\n     alphabetical brand list reading naturally (A–M | N–Z). */\n  .bp-mega__tabs[data-bp-tab-columns=\"2\"] {\n    grid-template-columns: minmax(180px, 1fr) minmax(0, 3fr) minmax(0, 2fr);\n  }\n  .bp-mega__tabs[data-bp-tab-columns=\"2\"] .bp-mega__links {\n    display: block;\n    columns: 2;\n    column-gap: var(--bp-section-gap);\n  }\n  .bp-mega__tabs[data-bp-tab-columns=\"2\"] .bp-mega__links li {\n    margin-bottom: 8px;\n    break-inside: avoid;\n    -webkit-column-break-inside: avoid;\n  }\n  .bp-mega__tabs[data-bp-tab-columns=\"2\"] .bp-mega__links li:last-child {\n    margin-bottom: 0;\n  }\n  .bp-mega__promos--tabs {\n    /* Match the columns_promos promos (styleEDIT): fixed 220px columns so the\n       images render full-size. `minmax(0,1fr)` collapsed them to a sliver\n       because the promos container is content-sized (flex:0 0 auto) — the\n       fr units had no defined width to divide, so the 4:5 images shrank to\n       their min. The tabs dropdown has ample room on the right (tabs + brand\n       list only fill the left half). */\n    grid-template-columns: repeat(2, 220px);\n    display: grid;\n    gap: var(--bp-section-gap);\n  }\n\n  @media screen and (max-width: 989px) {\n    .bp-mega__tabs,\n    .bp-mega__tabs[data-bp-tab-columns=\"2\"] { grid-template-columns: 1fr; }\n    .bp-mega__promos--tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n    /* Not enough width for two link columns once the tabs stack — collapse. */\n    .bp-mega__tabs[data-bp-tab-columns=\"2\"] .bp-mega__links { columns: 1; }\n  }\n\n  @media screen and (max-width: 749px) {\n    .bp-mega { display: none; }\n  }\n\n  /* BP Cart Drawer — markup, CSS, and JS live in\n     snippets/bp-cart-drawer.liquid (rendered from theme.liquid).\n     Hide Horizon's cart-drawer-component since BP has its own. */\n  cart-drawer-component { display: none !important; }\n\n  /* ===== §9.1 BP Section knobs — base rules ===========================\n     Consumes CSS variables emitted by snippets/bp-section-knobs.liquid.\n     Sections opt in by carrying `data-bp-section`, `data-section-id`,\n     and `data-bp-mode-{d,m}` attributes on the wrapping element.\n     Mobile is the default; desktop overrides at ≥1024px (§1).\n     ================================================================= */\n\n  [data-bp-section] {\n    background: var(--bp-knobs-bg-section, transparent);\n    color: var(--bp-knobs-text, var(--bp-color-text));\n  }\n\n  [data-bp-section][data-bp-mode-m='padded'] {\n    padding-block: var(--bp-knobs-pad-y-m, var(--bp-section-pad-y));\n    padding-inline: var(--bp-knobs-pad-x-m, var(--bp-section-pad-x));\n  }\n  [data-bp-section][data-bp-mode-m='full'] {\n    padding-block: var(--bp-knobs-pad-y-m, var(--bp-section-pad-y));\n    padding-inline: 0;\n  }\n\n  /* Inner block — only renders meaningfully when padded. Holds the\n     inner background color so a padded section can have a section bg\n     AND a different inner-block bg (per §9.1). */\n  [data-bp-section] .bp-section__inner {\n    background: var(--bp-knobs-bg-inner, transparent);\n  }\n\n  /* Title alignment — opt in via class `bp-section__title` on the\n     heading. text-align is inheritable, so descendant copy follows. */\n  [data-bp-section] .bp-section__title {\n    text-align: var(--bp-knobs-align-m, start);\n  }\n\n  @media screen and (min-width: 1024px) {\n    [data-bp-section][data-bp-mode-d='padded'] {\n      padding-block: var(--bp-knobs-pad-y-d, var(--bp-section-pad-y));\n      padding-inline: var(--bp-knobs-pad-x-d, var(--bp-section-pad-x));\n    }\n    [data-bp-section][data-bp-mode-d='full'] {\n      padding-block: var(--bp-knobs-pad-y-d, var(--bp-section-pad-y));\n      padding-inline: 0;\n    }\n    [data-bp-section] .bp-section__title {\n      text-align: var(--bp-knobs-align-d, start);\n    }\n  }\n\n  /* ===== §9.3 BP Media block — base rules ============================\n     Used by snippets/bp-section-media.liquid. The snippet emits a\n     [data-bp-media] wrapper with optional `--bp-media-ratio-{d,m}`\n     custom properties and an optional .bp-media__overlay child.\n     The overlay's solid vs. gradient + coverage live entirely in CSS\n     so the merchant gets live-preview without re-rendering markup.\n\n     §9.3 rule: images always fill the full width of their slot.\n     position:relative + absolute children + object-fit cover does\n     this regardless of the slot's height (which the section sizes).\n     ================================================================= */\n\n  [data-bp-media] {\n    position: relative;\n    overflow: hidden;\n    width: 100%;\n    /* Mobile-first ratio. Falls through to the desktop ratio when no\n       mobile-specific value is set. `auto` (the default) leaves the\n       slot to be sized by its parent (e.g. fixed mobile band height,\n       desktop grid row stretch). */\n    aspect-ratio: var(--bp-media-ratio-m, var(--bp-media-ratio-d, auto));\n  }\n\n  [data-bp-media] .bp-media__image,\n  [data-bp-media] .bp-media__video {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    /* Fit: cover (default, fills + crops) vs contain (whole asset shown,\n       may letterbox against the slot bg). Set per media block via the\n       {prefix}_fit knob — e.g. a rotating-logo video that must never be\n       cropped uses 'contain'. */\n    object-fit: var(--bp-media-fit, cover);\n    /* Focal point. Mobile-first; desktop override below.\n       Merchants pick from a 9-position select on the media block. */\n    object-position: var(--bp-media-pos-m, var(--bp-media-pos-d, center center));\n    display: block;\n  }\n\n  [data-bp-media] .bp-media__placeholder {\n    position: absolute;\n    inset: 0;\n    background: linear-gradient(135deg, #e8e6df 0%, #cfccc1 100%);\n  }\n\n  /* Overlay — sits on top of the media, solid or gradient. The\n     coverage % indicates how much of the height (anchored to the\n     bottom) carries the colour:\n       - solid: a hard band from 0 to coverage% (transparent above)\n       - gradient: fades from full colour at the bottom to transparent\n                   at coverage% from the bottom\n     Selectors are unscoped so block-level surfaces (hero slides,\n     look tiles, category cards) can use the same overlay without\n     needing the [data-bp-media] block-prefix machinery — drop the\n     element inside any position:relative parent and it fills it. */\n  .bp-media__overlay {\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    /* Opacity is responsive: --…-opacity-m (mobile) then the single\n       --…-opacity, then a default. Desktop override lives in the media\n       query below. */\n    opacity: var(--bp-media-overlay-opacity-m, var(--bp-media-overlay-opacity, 0.3));\n  }\n  /* Gradient DIRECTION + COVERAGE are driven per breakpoint by\n     --bp-media-overlay-dir-{m,d} and --bp-media-overlay-coverage-{m,d}\n     (emitted from the \"Overlay position\" + \"Coverage\" controls —\n     bottom→`to top`, top→`to bottom`, left→`to right`, right→`to left`).\n     Each falls back to its single-value var, then the bottom-anchored /\n     full-image default, so sections that set only the shared values (or\n     nothing) are unchanged. */\n  .bp-media__overlay--solid {\n    background: linear-gradient(\n      var(--bp-media-overlay-dir-m, to top),\n      var(--bp-media-overlay-color, #000) 0,\n      var(--bp-media-overlay-color, #000) var(--bp-media-overlay-coverage-m, var(--bp-media-overlay-coverage, 100%)),\n      transparent var(--bp-media-overlay-coverage-m, var(--bp-media-overlay-coverage, 100%))\n    );\n  }\n  .bp-media__overlay--gradient {\n    background: linear-gradient(\n      var(--bp-media-overlay-dir-m, to top),\n      var(--bp-media-overlay-color, #000) 0,\n      transparent var(--bp-media-overlay-coverage-m, var(--bp-media-overlay-coverage, 100%))\n    );\n  }\n\n  @media screen and (min-width: 1024px) {\n    [data-bp-media] {\n      aspect-ratio: var(--bp-media-ratio-d, auto);\n    }\n    [data-bp-media] .bp-media__image,\n    [data-bp-media] .bp-media__video {\n      object-position: var(--bp-media-pos-d, center center);\n    }\n    /* Desktop overlay — opacity, direction, and coverage each fall back to\n       the mobile value, then the single-value var, then the default, so a\n       desktop-only or single-value setup still works. */\n    .bp-media__overlay {\n      opacity: var(--bp-media-overlay-opacity-d, var(--bp-media-overlay-opacity-m, var(--bp-media-overlay-opacity, 0.3)));\n    }\n    .bp-media__overlay--solid {\n      background: linear-gradient(\n        var(--bp-media-overlay-dir-d, var(--bp-media-overlay-dir-m, to top)),\n        var(--bp-media-overlay-color, #000) 0,\n        var(--bp-media-overlay-color, #000) var(--bp-media-overlay-coverage-d, var(--bp-media-overlay-coverage-m, var(--bp-media-overlay-coverage, 100%))),\n        transparent var(--bp-media-overlay-coverage-d, var(--bp-media-overlay-coverage-m, var(--bp-media-overlay-coverage, 100%)))\n      );\n    }\n    .bp-media__overlay--gradient {\n      background: linear-gradient(\n        var(--bp-media-overlay-dir-d, var(--bp-media-overlay-dir-m, to top)),\n        var(--bp-media-overlay-color, #000) 0,\n        transparent var(--bp-media-overlay-coverage-d, var(--bp-media-overlay-coverage-m, var(--bp-media-overlay-coverage, 100%)))\n      );\n    }\n  }\n\n  /* ===== WCAG 2.2.2 pause/play button (bp-section-media.liquid) ======\n     Shown whenever a video autoplays without native controls. Positioned\n     bottom-left inside [data-bp-media]; z-index 2 keeps it above the\n     overlay (which sits at z-index 1 by stacking order). ============== */\n  .bp-media__pause-btn {\n    position: absolute;\n    bottom: 12px;\n    left: 12px;\n    z-index: 2;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 40px;\n    height: 40px;\n    padding: 0;\n    border: none;\n    border-radius: 50%;\n    background-color: rgba(0, 0, 0, 0.6);\n    color: #fff;\n    cursor: pointer;\n    transition: background-color 0.15s ease;\n  }\n  .bp-media__pause-btn:hover,\n  .bp-media__pause-btn:focus {\n    background-color: rgba(0, 0, 0, 0.82);\n  }\n  .bp-media__pause-btn:focus-visible {\n    outline: 2px solid #fff;\n    outline-offset: 2px;\n  }\n  .bp-media__pause-btn:focus:not(:focus-visible) {\n    outline: none;\n  }\n\n  /* ===== §9.2 BP CTA Group + Button — base rules =====================\n     Sections wrap their CTAs in `[data-bp-cta-group]` with\n     `data-dir-d=\"row|column\"` and `data-dir-m=\"row|column\"` to\n     control multi-button layout per breakpoint. Each button is a\n     `.bp-cta` rendered by snippets/bp-cta-button.liquid carrying\n     `data-w-{d,m}=\"fit|custom\"` plus inline `--bp-cta-w-{d,m}`\n     custom-percent values for the Custom width mode.\n     ================================================================= */\n\n  [data-bp-cta-group] {\n    display: flex;\n    flex-direction: column;\n    flex-wrap: wrap;\n    gap: 12px;\n    align-items: stretch;\n  }\n  /* Full-width toggle stretches the group container itself (not just its\n     buttons), so a group centered/shrink-wrapped by its parent still spans\n     the full available width and its stacked buttons truly fill it. Only the\n     CTA-group block opts in (data-full-width=\"true\"); legacy section-level\n     groups have no attribute and are unaffected. */\n  [data-bp-cta-group][data-full-width='true'] { width: 100%; }\n  [data-bp-cta-group][data-dir-m='row'] {\n    flex-direction: row;\n    align-items: center;\n  }\n  @media screen and (min-width: 1024px) {\n    [data-bp-cta-group][data-dir-d='row'] {\n      flex-direction: row;\n      align-items: center;\n    }\n    [data-bp-cta-group][data-dir-d='column'] {\n      flex-direction: column;\n      align-items: stretch;\n    }\n  }\n\n  /* Button width — default Fit (content-sized). Custom mode picks\n     the width up from the inline --bp-cta-w-{d,m} variable.\n     In a STACKED group, buttons grow to full container width — UNLESS the\n     group opts out via the Full-width toggle (bp-cta-group emits\n     data-full-width=\"false\"), where align-self:start defeats the group's\n     align-items:stretch so each button hugs its fit/custom width instead.\n     Groups with no attribute (legacy section-level [data-bp-cta-group])\n     keep the full-width default. */\n  .bp-cta[data-w-m='fit']  { width: auto; }\n  .bp-cta[data-w-m='custom'] { width: var(--bp-cta-w-m, 100%); }\n  @media screen and (max-width: 1023px) {\n    [data-bp-cta-group]:not([data-dir-m='row']):not([data-full-width='false']) .bp-block-cta { width: 100%; }\n    [data-bp-cta-group]:not([data-dir-m='row']):not([data-full-width='false']) .bp-cta { width: 100%; }\n    [data-bp-cta-group]:not([data-dir-m='row'])[data-full-width='false'] .bp-block-cta,\n    [data-bp-cta-group]:not([data-dir-m='row'])[data-full-width='false'] .bp-cta { align-self: flex-start; }\n  }\n  @media screen and (min-width: 1024px) {\n    .bp-cta[data-w-d='fit']    { width: auto; }\n    .bp-cta[data-w-d='custom'] { width: var(--bp-cta-w-d, 100%); }\n    [data-bp-cta-group][data-dir-d='column']:not([data-full-width='false']) .bp-block-cta { width: 100%; }\n    [data-bp-cta-group][data-dir-d='column']:not([data-full-width='false']) .bp-cta { width: 100%; }\n    [data-bp-cta-group][data-dir-d='column'][data-full-width='false'] .bp-block-cta,\n    [data-bp-cta-group][data-dir-d='column'][data-full-width='false'] .bp-cta { align-self: flex-start; }\n  }\n\n  /* Base button shape — height + padding + typography. The colour\n     palette comes from the section-local --bp-knobs-text + a small\n     set of role-specific defaults below; sections can also layer in\n     their own per-section CTA tokens via extra classes. */\n  .bp-cta {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    gap: 8px;\n    height: 52px;\n    padding: 0 28px;\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-weight: 500;\n    line-height: normal;\n    letter-spacing: -0.17px;\n    text-decoration: none;\n    /* Default variant (secondary-like) — outlined dark on transparent.\n       Always uses BP brand tokens, NOT --bp-knobs-text, so the button\n       palette stays consistent regardless of the section's text color.\n       Sections that need a different palette layer in their own scoped\n       override (e.g. hero slides on dark imagery use `primary-light`). */\n    border: 1px solid var(--bp-color-text);\n    color: var(--bp-color-text);\n    background: transparent;\n    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;\n    cursor: pointer;\n    white-space: nowrap;\n    box-sizing: border-box;\n  }\n  /* Keyboard focus indicator (WCAG 2.4.7). No focus style existed, so tabbing\n     to a CTA showed nothing — flagged on the Image + Text Banner (Alfred, 7/27,\n     ADA). `:focus-visible` (not `:focus`) so a mouse click doesn't leave a\n     ring. The ring is OFFSET outside the button so it sits on the section/page\n     background: a dark ring reads on the light surfaces every standard variant\n     lives on; the on-dark variants (used over imagery) switch to the light\n     label color below. Matches the existing `.bp-card__swatch:focus-visible`\n     pattern. Also keep link-style CTAs underlined on hover so they never\n     collapse to plain text (the second half of the ticket). */\n  .bp-cta:focus-visible {\n    outline: 2px solid var(--bp-color-text);\n    outline-offset: 3px;\n  }\n  .bp-cta--primary-light:focus-visible,\n  .bp-cta--secondary-light:focus-visible,\n  .bp-cta--link-white:focus-visible {\n    outline-color: var(--bp-color-cta-text);\n  }\n  .bp-cta--link:hover,\n  .bp-cta--link:focus-visible,\n  .bp-cta--link-white:hover,\n  .bp-cta--link-white:focus-visible {\n    text-decoration: underline;\n  }\n  .bp-cta__icon {\n    display: inline-flex;\n    align-items: center;\n    width: 20px;\n    height: 20px;\n  }\n  .bp-cta__icon img {\n    width: 100%;\n    height: 100%;\n    display: block;\n    object-fit: contain;\n  }\n\n  /* Primary — fixed BP brand palette: dark fill + light label. The\n     palette stays consistent across sections regardless of the\n     section's `bp_text_color` setting; sections that need a different\n     look on dark imagery pick `primary-light` (white fill, dark\n     label) instead. */\n  .bp-cta--primary {\n    background: var(--bp-color-text);\n    color: var(--bp-color-cta-text);\n    border-color: var(--bp-color-text);\n  }\n  .bp-cta--primary:hover {\n    background: transparent;\n    color: var(--bp-color-text);\n  }\n\n  /* Primary-light: inverse of primary — white fill + dark label.\n     Use on sections that sit on dark imagery (e.g. hero closing\n     sliders) where a dark filled CTA clashes with the background. */\n  .bp-cta--primary-light {\n    background: var(--bp-color-bg-page);\n    color: var(--bp-color-text);\n    border-color: #fff;\n  }\n  /* primary-light is the white-filled button used ON DARK imagery / dark\n     sections. Its hover must stay LIGHT — transparent fill + near-white label\n     and border — otherwise it resolves to dark-on-dark and the button reads\n     \"all black\" on hover (QA: Dragana — \"Find your look\" / \"View Details\" on\n     the homepage promo header). This is the correct default for the style, so\n     it no longer needs the per-CTA \"Hover style: White\" opt-in. */\n  .bp-cta--primary-light:hover {\n    background: transparent;\n    color: var(--bp-color-cta-text);\n    border-color: var(--bp-color-cta-text);\n  }\n\n  /* Sand: filled sand (#E8DFD0) button with dark-brown (#2B241A) label.\n     Hover inverts to the sand-invert palette. */\n  .bp-cta--sand {\n    background: var(--bp-color-cta-sand);\n    color: var(--bp-color-cta-sand-text);\n    border-color: var(--bp-color-cta-sand);\n  }\n  .bp-cta--sand:hover {\n    background: var(--bp-color-cta-sand-text);\n    color: var(--bp-color-cta-sand);\n    border-color: var(--bp-color-cta-sand-text);\n  }\n\n  /* Sand (inverted): dark-brown fill with sand label — the invert of\n     --sand. Hover swaps to the filled-sand palette. */\n  .bp-cta--sand-invert {\n    background: var(--bp-color-cta-sand-text);\n    color: var(--bp-color-cta-sand);\n    border-color: var(--bp-color-cta-sand-text);\n  }\n  .bp-cta--sand-invert:hover {\n    background: var(--bp-color-cta-sand);\n    color: var(--bp-color-cta-sand-text);\n    border-color: var(--bp-color-cta-sand);\n  }\n\n  .bp-cta--secondary:hover {\n    background: var(--bp-color-text);\n    color: var(--bp-color-cta-text);\n  }\n\n  /* Secondary-light: the on-dark counterpart to `secondary`. Same\n     outlined geometry, but a WHITE border + WHITE label on a\n     transparent fill so it reads on dark imagery (e.g. the \"Who we are\"\n     banner over a photo) where the standard dark `secondary` outline\n     would disappear. Hover inverts exactly like `secondary` does —\n     fills with the border color (white) and flips the label dark. */\n  .bp-cta--secondary-light {\n    background: transparent;\n    color: var(--bp-color-cta-text);\n    border-color: var(--bp-color-cta-text);\n  }\n  .bp-cta--secondary-light:hover {\n    background: var(--bp-color-cta-text);\n    color: var(--bp-color-text);\n    border-color: var(--bp-color-cta-text);\n  }\n  .bp-cta--link {\n    height: auto;\n    padding: 0;\n    border: 0;\n    text-decoration: underline;\n    text-underline-offset: 4px;\n  }\n  .bp-cta--link:hover { opacity: 0.65; }\n\n  /* Underline link, white text — for CTAs sitting on dark imagery /\n     dark section backgrounds where the standard `link` (which inherits\n     foreground color) would read black-on-black. Same geometry as\n     `--link`; explicitly sets color to var(--bp-color-cta-text) so it\n     doesn't pick up the surrounding text color. */\n  .bp-cta--link-white {\n    height: auto;\n    padding: 0;\n    border: 0;\n    background: transparent;\n    color: var(--bp-color-cta-text, #FDFFFA);\n    text-decoration: underline;\n    text-underline-offset: 4px;\n  }\n  .bp-cta--link-white:hover { opacity: 0.65; }\n\n  /* Opt-in hover: transparent fill + white border + white text. Set per CTA\n     via the BP CTA block's \"Hover style\" = White. For CTAs on dark backgrounds\n     (e.g. the black homepage promo bar) where the default per-style hover\n     resolves to dark-on-dark (QA: Dragana). !important so it wins over the\n     equal-specificity per-variant :hover rules regardless of source order. */\n  .bp-cta--hover-white:hover {\n    background: transparent !important;\n    color: #fff !important;\n    border-color: #fff !important;\n    opacity: 1 !important;\n  }\n\n  /* (Legacy --bp-cta-on override removed — primary's palette is now\n     fixed at the base, so there's no longer a white-on-white scenario\n     for sections to opt out of. Sections that need a light CTA on\n     dark imagery should pick the `primary-light` variant instead.) */\n\n  /* ===== §9.1.x Text-overlay placement (9-position) ==================\n     Used by sections that lay copy on top of media (hero slides,\n     grid tiles). The wrapping element opts in via `[data-bp-overlay]`\n     and reads four custom properties per breakpoint emitted by\n     snippets/bp-overlay-place.liquid:\n       --bp-overlay-block-{d,m}     start | center | end  (vertical)\n       --bp-overlay-inline-{d,m}    start | center | end  (horizontal)\n       --bp-overlay-text-{d,m}      start | center | end\n\n     The element is a column-direction flex container, so the\n     vertical (block) axis is the MAIN axis (justify-content) and the\n     horizontal (inline) axis is the CROSS axis (align-items). The\n     text-align inherits from this container down to descendants. */\n  [data-bp-overlay] {\n    display: flex;\n    flex-direction: column;\n    justify-content: var(--bp-overlay-block-m, end);\n    align-items: var(--bp-overlay-inline-m, center);\n  }\n  [data-bp-overlay] > * {\n    text-align: var(--bp-overlay-text-m, center);\n  }\n  @media screen and (min-width: 1024px) {\n    [data-bp-overlay] {\n      justify-content: var(--bp-overlay-block-d, center);\n      align-items: var(--bp-overlay-inline-d, start);\n    }\n    [data-bp-overlay] > * {\n      text-align: var(--bp-overlay-text-d, start);\n    }\n  }\n\n  /* ============================================================\n     Discount Kit (Helium) — Peak Progress GWP bar\n     Targets the markup the app's embed injects (`#peak-progress-wrapper`).\n     Restyled to match the BP free-gift bar in the Figma: Messina Sans\n     typography, BP color tokens, slim 4px track with cream background +\n     gold fill + a dot indicator at the fill's right edge.\n     If marketing later swaps in a different DK block (e.g. tiered),\n     these selectors stop matching gracefully — DK's own styles show\n     through.\n     ============================================================ */\n  #peak-progress-wrapper {\n    padding: 16px 0 24px;\n    border-bottom: 1px solid rgba(23, 22, 9, 0.08);\n    font-family: var(--bp-font-body);\n    color: var(--bp-color-text);\n  }\n  #peak-progress-wrapper .peak-progress-container {\n    display: block;\n  }\n  #peak-progress-wrapper .peak-progress-message {\n    display: flex;\n    justify-content: space-between;\n    align-items: baseline;\n    margin-bottom: 8px;\n    gap: 12px;\n  }\n  #peak-progress-wrapper .threshold-title,\n  #peak-progress-wrapper .threshold-count-message,\n  #peak-progress-wrapper .threshold-counter {\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    font-weight: 700;\n    letter-spacing: -0.14px;\n    color: var(--bp-color-text);\n  }\n  #peak-progress-wrapper .peak-progress-bar-outer {\n    position: relative;\n    height: 4px;\n    background: #E8DFD0;\n    border-radius: 0;\n    overflow: visible;\n  }\n  #peak-progress-wrapper .peak-progress-bar-inner {\n    position: relative;\n    height: 100%;\n    background: #EBAE55;\n    border-radius: 0;\n    transition: width 0.3s ease;\n  }\n  /* Dot indicator at the right edge of the fill — matches the BP Figma.\n     Pinned to the inner bar's end via `right: 0` + `translate(50%, -50%)`\n     so it tracks the fill width without extra JS. */\n  #peak-progress-wrapper .peak-progress-bar-inner::after {\n    content: '';\n    position: absolute;\n    top: 50%;\n    right: 0;\n    transform: translate(50%, -50%);\n    width: 12px;\n    height: 12px;\n    border-radius: 50%;\n    background: var(--bp-color-bg-page);\n    border: 2px solid #EBAE55;\n    box-sizing: border-box;\n  }\n  #peak-progress-wrapper .progress-copy {\n    margin: 12px 0 0;\n  }\n  #peak-progress-wrapper .peak-progress-amount {\n    font-family: var(--bp-font-body);\n    font-size: 13px;\n    color: var(--bp-color-body-copy);\n  }\n\n  /* ============================================================\n     BP Search Drawer + Search Panel\n     ============================================================ */\n\n  /* Prevent Horizon's search modal from appearing — bp-search-drawer\n     always intercepts the trigger and handles search instead (its own JS\n     branches internally on settings.bp_br_search_enabled to pick\n     Bloomreach vs. native Shopify results; the container/UI is the same\n     either way). Target both the custom-element wrapper and the inner dialog. */\n  dialog-component#search-modal,\n  #search-modal dialog {\n    display: none !important;\n  }\n\n  /* /search page — hide the \"Search\" / \"Search results\" title (it stays in\n     the DOM as the page's a11y <h1>, just visually hidden) and let the\n     search input span full width, so the page opens with a full-width bar\n     over the two-column results, matching the topnav search popup. */\n  .search-page__header h1 {\n    position: absolute !important;\n    width: 1px;\n    height: 1px;\n    margin: -1px;\n    padding: 0;\n    border: 0;\n    overflow: hidden;\n    clip: rect(0 0 0 0);\n    white-space: nowrap;\n  }\n  .search-page__header {\n    display: block;\n  }\n\n  /* Restyle Horizon's boxed _search-input into the Figma underline bar:\n     search icon + input on one row, a single bottom rule, full width. */\n  .search-page__header .search-page-input__parent { width: 100%; }\n  .search-page__header search-page-input-component {\n    max-width: 100% !important;\n    width: 100%;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    margin: 0 0 28px;\n    padding-block: 10px;\n    border-bottom: 1px solid var(--bp-color-body-copy, #74736B);\n    background: transparent;\n  }\n  .search-page__header .search-page-input {\n    border: 0 !important;\n    border-radius: 0 !important;\n    background: transparent !important;\n    padding: 4px 0 !important;\n    font-family: var(--bp-font-body);\n    font-size: 16px;\n    color: var(--bp-color-text);\n  }\n  .search-page__header .search-page-input::placeholder {\n    color: rgba(23, 22, 9, 0.62);\n  }\n  /* Icon inline (Horizon positions it absolutely for the boxed look). */\n  .search-page__header search-page-input-component .search__icon {\n    position: static !important;\n    left: auto !important;\n    flex-shrink: 0;\n    width: 44px;\n    height: 44px;\n    aspect-ratio: 1 / 1;\n    color: var(--bp-color-text);\n    opacity: 0.6;\n  }\n  .search-page__header search-page-input-component .search__icon svg {\n    width: 44px;\n    height: 44px;\n  }\n  /* Keep the clear button pinned to the right edge of the row. */\n  .search-page__header search-page-input-component .search__reset-button {\n    right: 0;\n  }\n\n  .bp-sp {\n    background: var(--bp-color-bg-page);\n    padding: 28px var(--bp-section-pad-x) 40px;\n  }\n\n  .bp-sp__body {\n    display: grid;\n    grid-template-columns: 200px 1fr;\n    gap: 48px;\n    align-items: start;\n  }\n\n  .bp-sp__sidebar {\n    display: flex;\n    flex-direction: column;\n    gap: 24px;\n    flex-shrink: 0;\n  }\n\n  .bp-sp__group-title {\n    margin: 0 0 10px;\n    font-family: var(--bp-font-body);\n    font-size: 13px;\n    font-weight: 700;\n    line-height: 145%;\n    color: var(--bp-color-text);\n  }\n\n  .bp-sp__links {\n    list-style: none;\n    margin: 0;\n    padding: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n  }\n\n  .bp-sp__link {\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    font-weight: 400;\n    line-height: 145%;\n    color: var(--bp-color-text);\n    text-decoration: none;\n  }\n  .bp-sp__link:hover {\n    text-decoration: underline;\n    text-underline-offset: 3px;\n  }\n\n  .bp-sp__products-title {\n    margin: 0 0 16px;\n    font-family: var(--bp-font-body);\n    font-size: 13px;\n    font-weight: 700;\n    line-height: 145%;\n    color: var(--bp-color-text);\n  }\n\n  .bp-sp__grid {\n    list-style: none;\n    margin: 0;\n    padding: 0;\n    display: grid;\n    /* Tablet 3 per row; desktop 4 (below); mobile 2 (below). 3-up read as too\n       large on desktop for both the /search results and the topnav search-\n       drawer suggested results, which share this grid (QA 7/16, Adrienne). */\n    grid-template-columns: repeat(3, 1fr);\n    gap: var(--bp-section-gap);\n  }\n  @media screen and (min-width: 1024px) {\n    .bp-sp__grid {\n      grid-template-columns: repeat(4, 1fr);\n    }\n  }\n\n  .bp-sp__item {\n    min-width: 0;\n  }\n  .bp-sp__item > product-card,\n  .bp-sp__item .bp-card-host { display: contents; }\n\n  /* Match the sitewide product-card ratio (3 / 4, see .bp-card__media above).\n     The old 325 / 513 (~0.634) was taller/narrower than the source art, so\n     object-fit: cover cropped the sides of every search-drawer thumbnail. */\n  .bp-sp__item .bp-card__media {\n    aspect-ratio: 3 / 4;\n    height: auto;\n  }\n\n  .bp-sp__footer {\n    margin-top: 24px;\n  }\n\n  .bp-sp__view-all {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    padding: 10px 28px;\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    font-weight: 500;\n    line-height: 1;\n    letter-spacing: 0.01em;\n    color: var(--bp-color-text);\n    background: transparent;\n    border: 1px solid var(--bp-color-text);\n    cursor: pointer;\n    text-decoration: none;\n    transition: background 0.15s ease, color 0.15s ease;\n  }\n  .bp-sp__view-all:hover {\n    background: var(--bp-color-text);\n    color: var(--bp-color-cta-text, #FDFFFA);\n  }\n\n  @media screen and (max-width: 1023px) {\n    .bp-sp__body {\n      grid-template-columns: 180px 1fr;\n      gap: 32px;\n    }\n  }\n\n  @media screen and (max-width: 767px) {\n    .bp-sp {\n      padding: 20px 16px 32px;\n    }\n    .bp-sp__body {\n      grid-template-columns: 1fr;\n      gap: 24px;\n    }\n    .bp-sp__grid {\n      grid-template-columns: repeat(2, 1fr);\n    }\n    .bp-sp__view-all {\n      width: 100%;\n    }\n  }\n\n  /* GTM / ad-network tracking pixels injected into <body> are 1×1\n     images rendered inline, adding ~20px of line-height space below\n     the footer. Force them out of the normal flow. We target by\n     domain and by size so legitimate content images are unaffected.\n\n     EXCLUSIONS on the size-based selector mirror the earlier rule\n     (~L37) — the Stylitics \"How to Wear It\" widget renders each tile\n     as <img width=\"1\" height=\"1\" class=\"stylitics-ui-image\"\n     data-testid=\"stylitics-ui-image\" loading=\"eager\"> as a lazy-load\n     placeholder, then resizes via Stylitics' --max-size CSS variable.\n     Without these :not() guards the tiles stay pinned at 1×1 and the\n     widget looks empty. */\n  img[src*=\"dstillery.com\"],\n  img[src*=\"doubleclick.net\"],\n  img[src*=\"google-analytics.com\"],\n  img[src*=\"facebook.com/tr\"],\n  img[src*=\"bat.bing.com\"],\n  img[width=\"1\"][height=\"1\"]:not([class*=\"stylitics\"]):not([data-testid]):not([loading]) {\n    position: absolute !important;\n    width: 1px !important;\n    height: 1px !important;\n    overflow: hidden !important;\n    pointer-events: none !important;\n  }\n\n  /* ============================================================\n     Narvar (Shipping Protection) — restyle injected buttons + hide\n     the Narvar product surface.\n\n     Narvar's storefront JS injects:\n       - <button id=\"CartDrawer-Checkout-DP-With\">    primary checkout\n       - <button id=\"CartDrawer-Checkout-DP-Without\"> secondary \"without\n                                                       shipping protection\"\n       - A product page for the underlying SKU `narvardeliveryprotection`\n         (shouldn't be browsable as a normal product)\n\n     Atlas's CSS used Tailwind utilities (rgb(0 0 0 / opacity), 50px\n     height, font-weight 600). We rewrite using BP design tokens\n     (--bp-color-text, --bp-color-cta-text, --bp-font-body, 52px to\n     match the BP cart drawer's other checkout buttons) so the\n     Narvar buttons land in the same visual rhythm as the rest of\n     the BP cart drawer instead of looking like an Atlas/Tailwind\n     graft.\n\n     Atlas reference: Narvar custom CSS pasted by client 2026-05-22.\n     ============================================================ */\n\n  /* NOTE: previously had a global\n       div[data-product-handle=\"narvardeliveryprotection\"]\n       { display: none !important; }\n     rule here to hide the Narvar SKU from PLP/search. Removed —\n     our cart line items now (correctly, for Narvar to detect them)\n     carry data-product-handle, so the rule also hid the Narvar\n     line ITEM in the cart, breaking checkout. Hide the product\n     from PLP/search via Shopify product visibility instead\n     (Admin → Product → Sales channels → uncheck Online Store)\n     or by leaving it out of every collection.\n\n     Now also adding the canonical CartPage-* IDs alongside the\n     CartDrawer-* ones — Narvar uses different ID prefixes on the\n     /cart page vs the drawer, so the styling has to cover both. */\n\n  /* Primary checkout button (Narvar injects this in place of the\n     stock checkout button when the toggle is ON). Match BP's\n     `.bp-cart-drawer__btn--primary` look. */\n  button#CartDrawer-Checkout-DP-With {\n    height: 52px;\n    margin: 0;\n    padding: 0 24px;\n    background: var(--bp-color-text);\n    color: var(--bp-color-cta-text);\n    border: 1px solid var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-weight: 500;\n    line-height: normal;\n    letter-spacing: -0.17px;\n    text-transform: none;\n    cursor: pointer;\n    transition: opacity 0.2s ease, background 0.2s ease;\n  }\n  button#CartDrawer-Checkout-DP-With:hover {\n    opacity: 0.85;\n  }\n\n  /* Narvar's current widget build adds its own stable class\n     (.narvar-cart-widget-button-checkout) alongside the DP-With id and\n     ships `background` + text-color rules on that class via a\n     stylesheet it injects itself (loaded later, after bp-fonts.liquid,\n     via GTM) — same load-order problem already documented above for\n     the CTA-casing fix. Out-specify with the bp-cart-drawer ancestor +\n     !important so BP black always wins regardless of when Narvar's\n     stylesheet lands, instead of just hoping the ID selector above is\n     specific enough. */\n  bp-cart-drawer button#CartDrawer-Checkout-DP-With,\n  bp-cart-drawer button.narvar-cart-widget-button-checkout {\n    background: var(--bp-color-text, #171609) !important;\n    color: var(--bp-color-cta-text) !important;\n  }\n\n  /* Protection total appended to the primary Checkout button. Narvar\n     renders a `#checkout-price` span inside its DP-With button on BOTH\n     the flyout and the /cart page. We previously hid it on the flyout\n     only (`bp-cart-drawer #checkout-price { display:none }`), per an\n     earlier \"design doesn't show the price\" note — but the /cart page\n     was never scoped by that rule, so it always showed the total. That\n     left the two surfaces inconsistent: page had the total, flyout did\n     not. QA 7/27 (Dragana) asks the flyout to match the page, so the\n     hide is removed and the total (subtotal + protection) shows on the\n     checkout button on both surfaces. */\n\n  /* Secondary \"Checkout without shipping protection\" button. Match\n     BP's `.bp-cart-drawer__btn--secondary` look — same height, BP\n     typography, dark outline on cream/white surface. */\n  button#CartDrawer-Checkout-DP-Without {\n    height: 52px;\n    margin: 0;\n    padding: 0 24px;\n    background: transparent;\n    color: var(--bp-color-text);\n    border: 1px solid var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-weight: 500;\n    line-height: normal;\n    letter-spacing: -0.17px;\n    text-transform: none;\n    cursor: pointer;\n    transition: backgro
