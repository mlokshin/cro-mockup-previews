und 0.2s ease, color 0.2s ease;\n  }\n  button#CartDrawer-Checkout-DP-Without:hover {\n    background: var(--bp-color-bg-cream);\n  }\n\n  /* Same buttons but on the /cart page — Narvar uses CartPage-* IDs\n     there. Mirror the styling so the cart page looks consistent with\n     the drawer. */\n  button#CartPage-Checkout-DP-With {\n    height: 52px;\n    margin: 0;\n    padding: 0 24px;\n    background: var(--bp-color-text);\n    color: var(--bp-color-cta-text);\n    border: 1px solid var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-weight: 500;\n    line-height: normal;\n    letter-spacing: -0.17px;\n    cursor: pointer;\n    transition: opacity 0.2s ease;\n  }\n  button#CartPage-Checkout-DP-With:hover {\n    opacity: 0.85;\n  }\n  button#CartPage-Checkout-DP-Without {\n    height: 52px;\n    margin: 0;\n    padding: 0 24px;\n    background: transparent;\n    color: var(--bp-color-text);\n    border: 1px solid var(--bp-color-text);\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-weight: 500;\n    line-height: normal;\n    letter-spacing: -0.17px;\n    cursor: pointer;\n    transition: background 0.2s ease;\n  }\n  button#CartPage-Checkout-DP-Without:hover {\n    background: var(--bp-color-bg-cream);\n  }\n\n  /* Narvar widget mount — collapse margin until Narvar populates it,\n     so the empty <div> doesn't leave a phantom gap above the\n     subtotal block. `:not(:empty)` keeps the natural spacing once\n     Narvar's React renders content into the mount. */\n  .bp-cart-drawer__narvar-widget:not(:empty) {\n    margin: 0;\n  }\n\n  /* ---- Shipping Protection loading skeleton (QA 7/27, Dragana) ----\n     Narvar injects the real cream box a few seconds after the flyout opens /\n     the cart page loads (its async bundle). This shimmer placeholder holds the\n     box's shape until then, so there's no empty-whitespace gap that then pops.\n     It mimics `.narvar-cart-widget-card` (cream, 8px padding, column, ~64px).\n     Hidden the instant Narvar's real widget lands in the adjacent mount\n     (`:has(+ mount > *)`) and when the JS marks it done / times out.\n     Supersedes the earlier reserve-space approach (#307), which read as an\n     empty whitespace gap. */\n  .bp-cart-drawer__sp-skeleton,\n  .bp-cart-page__sp-skeleton {\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n    padding: 8px;\n    min-height: 64px;\n    box-sizing: border-box;\n    background: var(--bp-color-bg-cream, #F7F6EA);\n    border-radius: 0;\n  }\n  .bp-cart-drawer__sp-skeleton:has(+ .bp-cart-drawer__narvar-widget > *),\n  .bp-cart-page__sp-skeleton:has(+ .bp-cart-page__narvar-widget > *),\n  .bp-sp-skeleton--hidden {\n    display: none !important;\n  }\n  .bp-cart-drawer__sp-skeleton-head,\n  .bp-cart-page__sp-skeleton-head {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n  }\n  .bp-sp-skeleton-bar {\n    display: block;\n    height: 12px;\n    border-radius: 2px;\n    background: linear-gradient(\n      90deg,\n      rgba(23, 22, 9, 0.06) 25%,\n      rgba(23, 22, 9, 0.12) 37%,\n      rgba(23, 22, 9, 0.06) 63%\n    );\n    background-size: 400% 100%;\n    animation: bpSpShimmer 1.4s ease infinite;\n  }\n  .bp-cart-drawer__sp-skeleton-title,\n  .bp-cart-page__sp-skeleton-title { width: 128px; height: 14px; }\n  .bp-cart-drawer__sp-skeleton-amt,\n  .bp-cart-page__sp-skeleton-amt { width: 44px; height: 14px; }\n  .bp-cart-drawer__sp-skeleton-desc,\n  .bp-cart-page__sp-skeleton-desc { width: 82%; height: 10px; }\n  @keyframes bpSpShimmer {\n    0%   { background-position: 100% 50%; }\n    100% { background-position: 0 50%; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .bp-sp-skeleton-bar { animation: none; }\n  }\n\n  /* Shipping Protection — skin Narvar's NATIVE widget as the BP cream box\n     (design parity). Narvar owns the price + copy + opt-out logic; we only\n     style its card. Key off Narvar's STABLE classes (narvar-cart-widget-*)\n     only — the _*_196oa_* hashes change on every app version. */\n  .narvar-cart-widget-card {\n    background: var(--bp-color-bg-cream, #F7F6EA) !important;\n    /* Figma parity (QA 7/23, Brooke): 8px padding + flex container.\n       Direct children are Narvar's header row (title + amount) and the\n       description — they MUST stack, so column direction is required;\n       row (the flex default) would sit the description beside the\n       header. Narvar owns the header's own internal left/right layout\n       via its hashed classes; we don't touch it. */\n    display: flex !important;\n    flex-direction: column !important;\n    padding: 8px !important;\n    gap: 8px !important;\n    justify-content: center !important;\n    /* stretch (not flex-start) so the direct children fill the row —\n       Narvar's header row needs full width for its own space-between to\n       push the amount to the right. Setting width:100% on the header\n       directly isn't an option: its class (_196oa_) is a per-version\n       hash. Text stays left-aligned either way. */\n    align-items: stretch !important;\n    align-self: stretch !important;\n    color: var(--bp-color-text, #171609) !important;\n    border-radius: 0 !important;\n  }\n  /* Force BP black on ALL widget text — Narvar's --color-accent (blue) leaks\n     into nested spans (the amount + title inner spans). */\n  .narvar-cart-widget-card,\n  .narvar-cart-widget-card * {\n    color: var(--bp-color-text, #171609) !important;\n  }\n  /* The design shows just the \"Shipping Protection\" label + info icon —\n     hide Narvar's UPS/InsureShield logo image IN THE CARD only (the info\n     modal shares the .narvar-cart-widget-logo class and keeps its hero logo). */\n  .narvar-cart-widget-card .narvar-cart-widget-logo {\n    display: none !important;\n  }\n  .narvar-cart-widget-title {\n    /* Heading / H6 — Signifier */\n    font-family: var(--bp-font-display) !important;\n    font-size: 14px !important;\n    font-weight: 300 !important;\n    line-height: 120% !important;\n    letter-spacing: -0.28px !important;\n    color: var(--bp-color-text, #171609) !important;\n  }\n  .narvar-cart-widget-amount,\n  .narvar-cart-widget-amount span {\n    /* Body / Book / Small — Messina, right-aligned */\n    font-family: var(--bp-font-body) !important;\n    font-size: 14px !important;\n    font-weight: 400 !important;\n    letter-spacing: -0.14px !important;\n    color: var(--bp-color-text, #171609) !important;\n  }\n  .narvar-cart-widget-description {\n    /* Body / Book / Tiny — Messina */\n    font-family: var(--bp-font-body) !important;\n    font-size: 10px !important;\n    font-weight: 400 !important;\n    line-height: 145% !important;\n    letter-spacing: -0.1px !important;\n    color: var(--bp-color-text, #171609) !important;\n    margin-top: -12px;\n  }\n  /* Mobile: pull the description up tight under the header (QA 7/23, Brooke). */\n  @media screen and (max-width: 749px) {\n    .narvar-cart-widget-description {\n      margin-top: -16px !important;\n    }\n  }\n  /* Info icon → BP black (Narvar defaults to a blue accent) + clickable\n     (the drawer closes on click so Narvar's info surface isn't clipped). */\n  .narvar-cart-widget-info-icon {\n    fill: var(--bp-color-text, #171609) !important;\n    width: 13px !important;\n    height: 13px !important;\n    cursor: pointer;\n  }\n\n  /* ---- Narvar Shipping Protection info modal (\"Peace of mind, delivered\").\n     Narvar injects it with minimal/broken styles; skin it with BP tokens.\n     Stable IDs (#insurance-modal-*) are reliable — the _*_1mgdm_* hashes churn\n     per app version. Shown when the widget info icon is clicked (the cart\n     drawer closes so this isn't clipped). ---- */\n  #insurance-modal-container {\n    position: fixed;\n    inset: 0;\n    width: 100vw;\n    z-index: 9999999999;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 16px;\n    background: rgba(23, 22, 9, 0.45);\n  }\n  #insurance-modal-content {\n    position: relative;\n    width: 100%;\n    max-width: 420px;\n    max-height: 88vh;\n    overflow-y: auto;\n    background: #FDFFFA;\n    color: var(--bp-color-text, #171609);\n    font-family: var(--bp-font-body);\n    padding: 32px 24px 24px;\n  }\n  #insurance-modal-header {\n    position: relative;\n    text-align: center;\n    margin-bottom: 20px;\n  }\n  #insurance-modal-icon-wrapper {\n    display: flex;\n    justify-content: center;\n    margin-bottom: 12px;\n  }\n  #insurance-modal-icon-image {\n    width: auto !important;\n    height: 40px !important;\n  }\n  #insurance-modal-hero-title {\n    font-family: var(--bp-font-display);\n    font-size: 22px;\n    font-weight: 300;\n    line-height: 120%;\n    letter-spacing: -0.44px;\n    margin: 0;\n    color: var(--bp-color-text, #171609);\n  }\n  #insurance-modal-close-button {\n    position: absolute;\n    top: -14px;\n    right: -8px;\n    background: transparent;\n    border: 0;\n    padding: 4px;\n    line-height: 0;\n    cursor: pointer;\n  }\n  #insurance-modal-features-list {\n    list-style: none;\n    padding: 0;\n    margin: 0 0 4px;\n  }\n  #insurance-modal-features-list li { margin: 0 0 14px; }\n  [id^=\"insurance-modal-feature-\"][id$=\"-title\"] {\n    font-family: var(--bp-font-body);\n    font-size: 14px;\n    font-weight: 600;\n    color: var(--bp-color-text, #171609);\n  }\n  [id^=\"insurance-modal-feature-\"][id$=\"-text\"] {\n    font-family: var(--bp-font-body);\n    font-size: 13px;\n    line-height: 145%;\n    color: var(--bp-color-text, #171609);\n  }\n  #insurance-modal-content hr {\n    border: 0;\n    border-top: 1px solid rgba(23, 22, 9, 0.15);\n    margin: 16px 0;\n  }\n  #insurance-modal-body-text,\n  #insurance-modal-footer {\n    font-family: var(--bp-font-body);\n    font-size: 11px;\n    line-height: 150%;\n    color: var(--bp-color-body-copy, #74736B);\n    margin: 0;\n  }\n  #insurance-modal-footer a { color: inherit; text-decoration: underline; }\n  #insurance-modal-powered-by { align-items: center; }\n  /* The \"Powered by Narvar Secure\" logo has no width/height attr, so a global\n     img rule was stretching it — pin it to its intrinsic 16px. */\n  #insurance-modal-powered-by-icon {\n    width: 16px !important;\n    height: 16px !important;\n    flex: 0 0 16px;\n  }\n\n  /* Narvar's toggle-card shell ships with a built-in `margin: 1rem 0`\n     from its CSS module (hashed class `_card_196oa_1`, which changes\n     on every Narvar extension bump). We target the stable widget-style\n     class instead — `.opt-out-button` is the class Narvar's React\n     applies to the card root when its widget_style setting is the\n     opt-out button variant (matches what BP uses). Zero out the\n     margin so our drawer's own `gap` controls spacing.\n\n     If a future widget-style switch is made (toggle / checkbox /\n     opt-in-button / add-button / flyout), add the corresponding\n     class here — see Narvar's `C` constant for the full list. */\n  .opt-out-button {\n    margin: 0 !important;\n  }\n\n  /* Spacing between Narvar's primary (DP-With) and secondary\n     (DP-Without) injected buttons. Narvar's React inlines\n     `style=\"margin: 1rem 0\"` on the DP-Without button; force a\n     top-only gap so the buttons sit flush against the form\n     bottom but still breathe between each other. Applied to both\n     surfaces (drawer + cart page). */\n  button#CartDrawer-Checkout-DP-Without,\n  button#CartPage-Checkout-DP-Without {\n    margin: 0.5rem 0 0 !important;\n  }\n  /* Mobile: tighter 4px gap between the primary + secondary Narvar\n     buttons (half the desktop value, same ratio as before — was 8px\n     over 1rem/16px). Kept directly after the 0.5rem rule above — equal\n     specificity + !important on both means source order decides, so\n     this MUST come last to win on mobile. */\n  @media screen and (max-width: 749px) {\n    button#CartDrawer-Checkout-DP-Without,\n    button#CartPage-Checkout-DP-Without {\n      margin: 4px 0 0 !important;\n    }\n  }\n\n  /* CTA casing (QA 7/14) — Narvar's injected checkout buttons should read\n     Title Case (\"Checkout Without Shipping Protection\"), matching the native\n     \"Checkout\" / \"View Bag\" CTAs and the design. The Narvar app's custom_css\n     (config/settings_data.json) forces text-transform: uppercase at the same\n     `button#id` specificity as bp-fonts, so load order decided it — hence the\n     inconsistent casing. Out-specify by scoping to the BP cart wrappers\n     (bp-cart-drawer / bp-cart-page → higher specificity) + !important so BP\n     always wins. `capitalize` (not `none`) because Narvar's own label text is\n     lower/upper-cased, so capitalize is what yields the Title-Case look. */\n  bp-cart-drawer button#CartDrawer-Checkout-DP-With,\n  bp-cart-drawer button#CartDrawer-Checkout-DP-Without,\n  bp-cart-page button#CartPage-Checkout-DP-With,\n  bp-cart-page button#CartPage-Checkout-DP-Without {\n    text-transform: capitalize !important;\n  }\n\n  /* ============================================================\n     BP hero slide + shop-by-category link styles — moved here\n     from sections/blocks during the block migration.\n\n     Why: Shopify's per-block / per-section stylesheet loading\n     proved unreliable for these specific markup patterns when\n     the section was migrated from inline section-defined blocks\n     to theme blocks. Putting the rules in the global bp-fonts\n     style block guarantees they apply regardless of which\n     section/block stylesheet Shopify chooses to load.\n\n     References:\n       - blocks/_bp-hero-slide.liquid (rendered article markup)\n       - blocks/_bp-shop-link.liquid (rendered <li> markup)\n       - sections/bp-hero-slider.liquid (wrapper + nav + dots)\n       - sections/bp-shop-by-category.liquid (heading + <ul>)\n     ============================================================ */\n\n  /* Shopify wraps every rendered theme block in a\n     <div class=\"shopify-block\" data-shopify-editor-block=\"...\">\n     wrapper for theme-editor click-to-edit. That wrapper breaks\n     direct-child layouts (the slide track's grid, the link list's\n     flex row, etc.) because the slide/list-item is no longer a\n     direct child of the parent — it sits inside the wrapper.\n\n     `display: contents` makes the wrapper layout-transparent: its\n     children behave as if they were direct children of the\n     parent for layout purposes (grid items, flex items). Block\n     identity for the editor stays — the wrapper still exists in\n     the DOM and carries data-shopify-editor-block. */\n  .bp-hero__track > .shopify-block,\n  .bp-hero__content-inner > .shopify-block,\n  .bp-shop-by-category__list > .shopify-block {\n    display: contents;\n  }\n\n  /* ----- bp-hero-slide ----- */\n\n  .bp-hero__slide {\n    grid-column: 1 / 2;\n    grid-row: 1 / 2;\n    position: relative;\n    display: block;\n    width: 100%;\n    max-width: 100vw;\n    min-height: var(--bp-hero-min-height-mobile);\n    aspect-ratio: var(--bp-hero-ratio-m, auto);\n    color: var(--bp-hero-text-color);\n\n    opacity: 0;\n    visibility: hidden;\n    pointer-events: none;\n    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),\n                visibility 0s linear 0.8s;\n  }\n\n  bp-hero-slider[data-has-ratio-m='true'] .bp-hero__slide {\n    display: flex;\n    flex-direction: column;\n    /* Unset the min-height so the slide's own aspect-ratio (set on\n       .bp-hero__slide above) drives its height on mobile. A min-height\n       floor here (e.g. max(50vh, max-content)) overrode the ratio and\n       pinned every slide to ~50vh, so the picked \"Aspect ratio (mobile)\"\n       had no visible effect. Copy taller than the ratio still grows the\n       slide via the flex column's max-content. */\n    min-height: unset;\n  }\n  bp-hero-slider[data-has-ratio-m='true'] .bp-hero__content {\n    flex: 1;\n    position: relative;\n    width: 100%;\n    min-height: auto;\n  }\n  @media screen and (min-width: 1024px) {\n    bp-hero-slider[data-has-ratio-d='true'] .bp-hero__slide {\n      display: flex;\n      flex-direction: column;\n      min-height: max-content;\n    }\n    bp-hero-slider[data-has-ratio-d='true'] .bp-hero__content {\n      flex: 1;\n      position: relative;\n      width: 100%;\n      min-height: auto;\n    }\n  }\n\n  .bp-hero__slide.is-active {\n    opacity: 1;\n    visibility: visible;\n    pointer-events: auto;\n    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),\n                visibility 0s linear 0s;\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .bp-hero__slide,\n    .bp-hero__slide.is-active {\n      transition: none;\n    }\n    /* a11y (WCAG 2.3.3): neutralise every smooth-scroll rail site-wide in\n       one place — the BP carousels (product-carousel, category-tiles,\n       shop-the-look, tabbed-gallery, our-most-loved, cart, etc.) each set\n       `scroll-behavior: smooth` locally. This overrides them all for users\n       who prefer reduced motion, instead of guarding 13 files. */\n    html:focus-within,\n    *,\n    *::before,\n    *::after {\n      scroll-behavior: auto !important;\n    }\n  }\n\n  .bp-hero__media {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    overflow: hidden;\n    background: var(--color-background-muted, #f3f3f0);\n    z-index: 0;\n  }\n\n  .bp-hero__picture {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    display: block;\n  }\n\n  .bp-hero__image {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    object-position: var(--bp-hero-img-pos-m);\n    display: block;\n  }\n  @media screen and (min-width: 1024px) {\n    .bp-hero__image {\n      object-position: var(--bp-hero-img-pos-d);\n    }\n  }\n\n  .bp-hero__image--placeholder {\n    background: linear-gradient(135deg, #e8e6df 0%, #cfccc1 100%);\n  }\n\n  .bp-hero__content {\n    position: relative;\n    z-index: 1;\n    flex-direction: column;\n    min-height: var(--bp-hero-min-height-mobile);\n    padding: var(--bp-hero-content-padding-mobile);\n    padding-bottom: 88px;\n    gap: 16px;\n    color: var(--bp-hero-text-color);\n  }\n\n  .bp-hero__content-inner {\n    display: flex;\n    flex-direction: column;\n    gap: 16px;\n    width: 100%;\n    max-width: var(--bp-hero-content-max-mobile);\n    align-items: var(--bp-overlay-inline-m, start);\n  }\n  @media screen and (min-width: 1024px) {\n    .bp-hero__content-inner {\n      align-items: var(--bp-overlay-inline-d, start);\n    }\n  }\n\n  .bp-hero__eyebrow {\n    margin: 0;\n    color: var(--bp-hero-text-color);\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-style: normal;\n    font-weight: 500;\n    line-height: 110%;\n    letter-spacing: -0.17px;\n    text-transform: uppercase;\n  }\n\n  .bp-hero__title {\n    margin: 0;\n    color: var(--bp-hero-text-color);\n    font-family: var(--bp-font-display);\n    font-size: clamp(36px, 6vw, 50px);\n    font-style: normal;\n    font-weight: 300;\n    line-height: 120%;\n    letter-spacing: -1px;\n  }\n\n  .bp-hero__description {\n    margin: 0;\n    color: var(--bp-hero-text-color);\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-style: normal;\n    font-weight: 500;\n    line-height: 145%;\n    letter-spacing: -0.17px;\n  }\n  .bp-hero__description > * {\n    margin: 0;\n    color: inherit;\n    font: inherit;\n    letter-spacing: inherit;\n  }\n  .bp-hero__description > * + * {\n    margin-top: 8px;\n  }\n\n  .bp-hero__ctas {\n    margin-top: 16px;\n    width: 100%;\n    align-items: var(--bp-overlay-inline-m, start);\n    justify-content: var(--bp-overlay-inline-m, start);\n  }\n\n  .bp-hero__cta.bp-cta {\n    border-color: var(--bp-hero-text-color);\n    color: #000;\n  }\n  .bp-hero__cta.bp-cta--primary {\n    background: var(--bp-color-text);\n    color: #fff;\n  }\n  .bp-hero__cta.bp-cta--primary:hover {\n    background: transparent;\n    color: var(--bp-hero-text-color);\n  }\n  .bp-hero__cta.bp-cta--primary-light {\n    background: var(--bp-color-bg-page);\n    color: var(--bp-color-text);\n    border-color: #fff;\n  }\n  .bp-hero__cta.bp-cta--primary-light:hover {\n    background: transparent;\n    color: var(--bp-hero-text-color);\n    border-color: var(--bp-hero-text-color);\n  }\n  .bp-hero__cta.bp-cta--secondary:hover {\n    background: var(--bp-hero-text-color);\n    color: #fff;\n  }\n\n  @media screen and (max-width: 480px) {\n    .bp-hero__content {\n      padding-bottom: 24px;\n    }\n  }\n\n  @media screen and (max-width: 749px) {\n    .bp-hero__title {\n      font-size: clamp(24px, 6vw, 36px);\n      letter-spacing: -0.5px;\n    }\n  }\n\n  @media screen and (min-width: 1024px) {\n    .bp-hero__slide {\n      min-height: var(--bp-hero-min-height-desktop);\n      aspect-ratio: var(--bp-hero-ratio-d, auto);\n    }\n\n    .bp-hero__content {\n      min-height: var(--bp-hero-min-height-desktop);\n      padding: var(--bp-hero-content-padding-desktop);\n      padding-bottom: var(--bp-hero-content-padding-desktop);\n    }\n\n    .bp-hero__content-inner {\n      max-width: none;\n      gap: 20px;\n    }\n    .bp-hero__description {\n      max-width: var(--bp-hero-content-max-desktop);\n    }\n\n    .bp-hero__ctas {\n      width: 100%;\n      margin-top: 24px;\n      align-items: var(--bp-overlay-inline-d, start);\n      justify-content: var(--bp-overlay-inline-d, start);\n    }\n\n    .bp-hero__cta.bp-cta {\n      min-width: 140px;\n    }\n  }\n\n  /* ----- bp-shop-by-category link ----- */\n\n  .bp-shop-by-category__item {\n    flex-shrink: 0;\n  }\n\n  .bp-shop-by-category__link {\n    display: inline-block;\n    color: inherit;\n    text-decoration: underline;\n    text-underline-offset: 4px;\n    font-family: var(--bp-font-body);\n    font-size: 17px;\n    font-style: normal;\n    font-weight: 500;\n    line-height: normal;\n    letter-spacing: -0.17px;\n    transition: opacity 0.2s ease;\n  }\n  .bp-shop-by-category__link:hover { opacity: 0.65; }\n\n  /* ============================================================\n     PAGE.CAREERS / PAGE.ABOUTUS — default body-copy color\n     ------------------------------------------------------------\n     Body-style bp-text blocks default to var(--bp-color-body-copy,\n     #74736B). Overrides the FINAL fallback in bp-text's color chain\n     (`color: var(--bp-text-color, var(--bp-knobs-text,\n     var(--bp-color-text))))` — not the `color` property itself —\n     so a merchant-set text_color on the block (which writes\n     --bp-text-color inline) STILL WINS.\n\n     Scoped to .bp-text--ff-body so display-family bp-text (h1-h6\n     using Signifier) keeps the dark --bp-color-text default.\n     ============================================================ */\n  main[data-template='page.careers'] .bp-text--ff-body,\n  main[data-template='page.aboutus'] .bp-text--ff-body,\n  main[data-template='page.sherylsloves'] .bp-text--ff-body,\n  main[data-template='page.prospect-introduction'] .bp-text--ff-body {\n    --bp-color-text: var(--bp-color-body-copy, #74736B);\n  }\n\n  /* /pages/customer-care — hero (bp-image-text-banner) keeps the 32px\n     mobile top padding but drops bottom padding to 0 so the link\n     grid below sits flush against the hero. The §9.1 bp_padding_y_m\n     knob is a single value (block top+bottom); the override below\n     zeros only padding-block-end. */\n  @media screen and (max-width: 1023px) {\n    main[data-template='page.customer-care'] [data-section-id$='__hero'] {\n      padding-block-end: 0 !important;\n    }\n  }\n\n  /* /pages/prospect-introduction — imagery grid content-tile spec.\n     The Figma frame is 40px padding / 10px gap / flex-column /\n     flex-start / stretch on the inner copy stack. Default §9.1.x\n     tile-content uses 24×16 padding and 8px gap; override here. */\n  main[data-template='page.prospect-introduction'] [data-section-id$='__bp_intro_imagery_grid'] .bp-grid__tile-content {\n    padding: 40px !important;\n  }\n  main[data-template='page.prospect-introduction'] [data-section-id$='__bp_intro_imagery_grid'] .bp-grid__tile-content-inner {\n    display: flex !important;\n    flex-direction: column !important;\n    align-items: flex-start !important;\n    gap: 10px !important;\n    align-self: stretch !important;\n  }\n\n  /* /pages/brands-we-love — intro section spec.\n     The section stays full-bleed (bp_bg_section cream extends to\n     viewport edges) and uses its natural stacked layout. The\n     overrides just dial the vertical padding to 80/40 and zero\n     the bp-fc__inner padding + min-height that were stacking on\n     top of the §9.1 section padding. */\n  html body [data-section-id$='__bwl_intro'],\n  html body [data-section-id='bwl_intro'] {\n    padding-block: 80px 40px !important;\n  }\n  html body [data-section-id$='__bwl_intro'] .bp-fc__inner,\n  html body [data-section-id='bwl_intro'] .bp-fc__inner {\n    padding: 0 !important;\n    min-height: 0 !important;\n    gap: 0 !important;\n  }\n  html body [data-section-id$='__bwl_intro'] .bp-fc__features:empty,\n  html body [data-section-id='bwl_intro'] .bp-fc__features:empty {\n    display: none !important;\n  }\n  @media (max-width: 1023px) {\n    html body [data-section-id$='__bwl_intro'],\n    html body [data-section-id='bwl_intro'] {\n      padding-block: 40px 24px !important;\n    }\n  }\n\n  /* /pages/brands-we-love — brand-grid tile titles match Figma H4:\n     24/300/Signifier/120%/-0.48px, white. The global .bp-fs-h4 sets\n     125% / -0.01em; this scoped rule tightens line-height + letter-\n     spacing to the spec exactly. The H4 preset on bp-text already\n     supplies size 24 + tag h4; per-instance JSON overrides\n     (font_family: display, font_weight: 300) carry the family/weight. */\n  html body [data-section-id$='__bwl_grid'] .bp-grid__tile .bp-text.bp-fs-h4,\n  html body [data-section-id='bwl_grid'] .bp-grid__tile .bp-text.bp-fs-h4 {\n    line-height: 120% !important;\n    letter-spacing: -0.48px !important;\n  }\n\n  /* /pages/brands-we-love — hero \"big one\" CTA forced to left.\n     The single Shop Now CTA must hug the left edge of the slide on\n     both breakpoints. Forces the group's main-axis to flex-start\n     AND defeats the §9.2 mobile stretch rule\n     ([data-bp-cta-group]:not([data-dir-m='row']) .bp-block-cta { width: 100% })\n     which was making the button full-width on mobile and centering\n     the label via the button's own justify-content: center. */\n  html body [data-section-id$='__bwl_hero'] .bp-hero__content [data-bp-cta-group],\n  html body [data-section-id='bwl_hero'] .bp-hero__content [data-bp-cta-group] {\n    justify-content: flex-start !important;\n    align-items: flex-start !important;\n  }\n  html body [data-section-id$='__bwl_hero'] .bp-hero__content [data-bp-cta-group] .bp-block-cta,\n  html body [data-section-id$='__bwl_hero'] .bp-hero__content [data-bp-cta-group] .bp-cta,\n  html body [data-section-id='bwl_hero'] .bp-hero__content [data-bp-cta-group] .bp-block-cta,\n  html body [data-section-id='bwl_hero'] .bp-hero__content [data-bp-cta-group] .bp-cta {\n    width: auto !important;\n    margin-right: auto !important;\n    align-self: flex-start !important;\n  }\n\n  /* ============================================================\n     YOTPO WIDGET — BP typography overrides\n     ============================================================\n     Yotpo injects its widget via tf-integration / yotpo-loader\n     scripts and inlines its own font (Futura-PT / Open Sans) on\n     the rendered elements. Force the BP body family on every\n     Yotpo text node so reviews + Q&A match the rest of the site.\n     The review BODY copy (.yotpo-read-more-text +\n     .yotpo-comment-content retailer reply) additionally gets the\n     Figma \"Body/XSmall Book\" spec — Messina 12 / 400 / 145% /\n     -0.12 / body-copy gray. */\n  .yotpo-widget-instance,\n  .yotpo-widget-instance *,\n  .yotpo-reviews-main-widget,\n  .yotpo-reviews-main-widget *,\n  .yotpo-reviews-star-ratings-widget,\n  .yotpo-reviews-star-ratings-widget * {\n    font-family: var(--bp-font-body), 'Messina Sans VF', system-ui, -apple-system, sans-serif !important;\n  }\n  .yotpo-widget-instance .yotpo-read-more-text,\n  .yotpo-widget-instance .yotpo-text-container,\n  .yotpo-widget-instance .yotpo-comment-content {\n    color: var(--bp-color-body-copy, #74736B) !important;\n    font-family: var(--bp-font-body), 'Messina Sans VF', system-ui, sans-serif !important;\n    font-size: 12px !important;\n    font-style: normal !important;\n    font-weight: 400 !important;\n    line-height: 145% !important;\n    letter-spacing: -0.12px !important;\n  }\n  /* Bold title elements — review headline + retailer reply heading.\n     Figma \"Body/Semi/Small\" spec: Messina 14 / 660 / 145% / -0.14\n     in BP black (#171609). */\n  .yotpo-widget-instance .yotpo-review-title,\n  .yotpo-widget-instance .yotpo-comment-title {\n    color: var(--bp-color-text, #171609) !important;\n    font-family: var(--bp-font-body), 'Messina Sans VF', system-ui, sans-serif !important;\n    font-size: 14px !important;\n    font-style: normal !important;\n    font-weight: 700 !important;\n    line-height: 145% !important;\n    letter-spacing: -0.14px !important;\n  }\n\n  /* \"With media\" toggle — Yotpo renders a button > label > SVG-circle\n     stack that flexes weirdly under the BP font override (label\n     becomes block-level, SVG drops below the text). Pin the button\n     to flex/row + 8px gap, keep the SVG inline. When aria-pressed,\n     fill the circle so the selected state reads. */\n  .yotpo-widget-instance .yotpo-media-select {\n    display: inline-flex !important;\n    flex-direction: row !important;\n    align-items: center !important;\n    gap: 8px !important;\n    background: transparent !important;\n    border: 1px solid rgba(23, 22, 9, 0.18) !important;\n    border-radius: 0 !important;\n    padding: 10px 12px !important;\n    cursor: pointer !important;\n    color: var(--bp-color-text, #171609) !important;\n    font-family: var(--bp-font-body), 'Messina Sans VF', system-ui, sans-serif !important;\n    font-size: 14px !important;\n    font-weight: 500 !important;\n    line-height: 145% !important;\n    letter-spacing: -0.14px !important;\n  }\n  .yotpo-widget-instance .yotpo-media-select .yotpo-radio-base {\n    display: inline-flex !important;\n    align-items: center !important;\n    flex: 1 1 auto !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    cursor: pointer !important;\n  }\n  .yotpo-widget-instance .yotpo-media-select .yotpo-selected-value {\n    color: inherit !important;\n    line-height: inherit !important;\n  }\n  .yotpo-widget-instance .yotpo-media-select .yotpo-radio-icon {\n    flex: 0 0 auto !important;\n    width: 16px !important;\n    height: 16px !important;\n    display: block !important;\n  }\n  .yotpo-widget-instance .yotpo-media-select[aria-pressed='true'] .yotpo-radio-icon circle {\n    fill: var(--bp-color-text, #171609) !important;\n    stroke: var(--bp-color-text, #171609) !important;\n  }\n\n  /* ── Header scroll-logo swap ─────────────────────────────────────\n     Swaps the header logo to the dedicated \"scroll\" variant\n     (settings.logo_scroll, rendered in blocks/_header-logo.liquid)\n     when the nav enters its compact state. Independent of Horizon's\n     transparent/inverse logo system — only the logo mark swaps.\n     Selectors carry #header-component so they outrank the existing\n     `.header-logo:has(...)` / `.header-logo__image-container--inverse`\n     display rules regardless of source order.\n\n     ── Why data-bp-nav and not data-sticky-state ──────────────────\n     These rules used to key off Horizon's [data-sticky-state='active']\n     (assets/header.js #observeStickyPosition). That flag is written by\n     Horizon's IntersectionObserver from the header's own visibility —\n     and the rules below CHANGE the header's height and position. Any\n     state whose styles perturb the geometry that produces the state is\n     a feedback loop: the observer writes a value, the header resizes /\n     unpins, the observer re-fires, writes the opposite value. The\n     header strobes between variants. (Measured 2026-07-14: with\n     threshold: 1, isIntersecting is false at ratio 0.9888 and true at\n     ratio 1, so Horizon's flag flips at exactly rect.top === 0 — the\n     single offset where a header pinned at top: -1px hands off from\n     in-flow to pinned. That is where the strobe appeared.)\n\n     data-bp-nav is owned solely by the scroll-threshold state machine\n     in layout/theme.liquid, driven by scrollY — an input the header's\n     own size cannot perturb. Horizon keeps writing data-sticky-state\n     for its own purposes (opacity, view-transition-name); it no longer\n     drives any geometry, so the two can never fight. */\n  .header-logo__image-container--scroll {\n    display: none;\n  }\n\n  /* ── Positioning model ────────────────────────────────────────────\n     Resting nav is IN FLOW and scrolls away with the page; only the\n     compact bar is fixed. Cancels Horizon's `position: sticky;\n     top: -1px` for sticky=\"always\" (sections/header.liquid:553).\n\n     .header-section keeps the resting header's height via\n     --bp-header-rest-h even while the child is fixed, so nothing below\n     ever shifts when the compact bar engages. That reserved space is\n     what makes scrollY a stable trigger: no reflow → no scroll\n     anchoring → no feedback into the threshold. Without it, going\n     fixed would pull ~70px of content up and move the very scroll\n     offset the state machine reads.\n\n     !important + the body prefix because Horizon's rule is\n     `.header-section:has(> #header-component[sticky='always'])`, whose\n     :has() takes the specificity of its argument (an id + attr), and\n     section stylesheet blocks are bundled separately from this inline\n     style tag — source order isn't guaranteed.\n\n     NB: don't write Liquid tag delimiters in these comments, even\n     inside a CSS comment. Liquid parses tags before CSS exists, so a\n     literal stylesheet/style tag written here is read as a real tag\n     nested inside this style block and throws at compile. */\n  body .header-section:has(> #header-component[sticky='always']) {\n    position: static !important;\n    top: auto !important;\n    min-height: var(--bp-header-rest-h, auto);\n  }\n\n  #header-component[data-bp-nav='compact'] {\n    position: fixed;\n    top: 0;\n    left: 0;\n    right: 0;\n    z-index: var(--layer-sticky);\n  }\n\n  /* flex (not block) so the icon centers on both axes instead of\n     sitting on the inline text baseline, which left descender\n     whitespace below it and made it look pushed toward the top of\n     the row. */\n  #header-component[data-bp-nav='compact'] .header-logo__image-container--scroll {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n\n  #header-component[data-bp-nav='compact'] .header-logo__image-container--original,\n  #header-component[data-bp-nav='compact'] .header-logo__image-container--inverse {\n    display: none;\n  }\n\n  /* Design request: collapse header__columns vertical padding to 0\n     the moment the header becomes sticky, so the sticky bar sits flush\n     rather than keeping the resting-state --header-padding. Overrides\n     header.liquid's `.header__columns { --padding-block-start/end }`\n     (assets/base.css .spacing-style reads these into padding-block). */\n  #header-component[data-bp-nav='compact'] .header__columns {\n    --padding-block-start: 0px;\n    --padding-block-end: 0px;\n  }\n\n  /* Design request: once the logo has swapped to the compact scroll\n     mark, let the left and right grid tracks (.header__column--left,\n     .header__column--right) hug their content width instead of the\n     resting-state 1fr / minmax(max-content, 1fr) tracks — frees up\n     space for the center column while sticky. --header-left/-right\n     feed --header-template-columns (grid-template-columns) above;\n     the ID selector's specificity beats every non-sticky :has()-based\n     --header-left/-right override in this file. */\n  #header-component[data-bp-nav='compact'] .header__columns {\n    --header-left: max-content;\n    --header-right: max-content;\n  }\n\n  /* ---------------------------------------------------------------\n     Quick-view product template (?view=quickview) — Atlas parity.\n\n     The Publitas digital-catalog product modal loads\n     /products/<handle>?view=quickview inside its #prod-frame iframe.\n     That renders templates/product.quickview.json (the buy box only).\n     Strip the site chrome so the iframe shows an optimized product\n     view — no topnav, announcement bar, footer, sticky ATC, or chat —\n     rather than the whole storefront.\n\n     Scoped with :has() off the <main data-template> attribute\n     (theme.liquid emits data-template=\"index\", which\n     resolves to \"product.quickview\" here), so nothing leaks onto\n     the normal PDP. Matches Atlas templates/product.quickview.liquid,\n     which display:none's #shopify-section-header / -footer / etc.\n     --------------------------------------------------------------- */\n\n  /* Hide all site chrome in the quickview modal. display:none is correct\n     here: the cart drawer is removed from the iframe entirely (see\n     bp-quickview-cart-bridge.liquid). The just-added item is shown by the\n     PARENT catalog page's cart drawer instead — it runs in full page\n     context (so its section-scoped line re-render works reliably) and\n     opens in the top layer, above the Publitas modal. Trying to render the\n     drawer inside the iframe was fragile: its syncItemsList() walks\n     ancestor shopify-section wrappers and re-fetches sections against the\n     iframe URL, which didn't repopulate the just-added line. */\n  body:has(main[data-template='product.quickview']) #header-group,\n  body:has(main[data-template='product.quickview']) > footer,\n  body:has(main[data-template='product.quickview']) .bp-sticky-atc,\n  body:has(main[data-template='product.quickview']) #chat-button {\n    display: none !important;\n  }\n\n  /* Same hides keyed off the BODY CLASS (layout/theme.liquid adds\n     `template-quickview`) instead of `:has(main…)`. The `:has(main…)` form only\n     matches AFTER <main> parses — which comes after the header — so on each\n     product change the header / announcement bar / BP logo / top menu flashed\n     visible for a frame before being hidden (Dragana QA 7/22). The body class\n     is present at first paint, so these hide with no flash.\n     This block ALSO strips the PDP-only buy-box extras the digital-catalog quick\n     view shouldn't show (Dragana QA 7/22): the gallery breadcrumb + \"How to Wear\n     It\" chip, the size-chart link, the TrueFit find-my-size widget, and the\n     Product Detail / Size & Fit / Shipping & Returns accordions. */\n  body.template-quickview #header-group,\n  body.template-quickview > footer,\n  body.template-quickview .bp-sticky-atc,\n  body.template-quickview #chat-button,\n  body.template-quickview .bp-pdp-gallery__crumbs,\n  body.template-quickview .bp-pdp-gallery__htwi,\n  body.template-quickview .bp-size-chart-link,\n  body.template-quickview .tfc-fitrec-product,\n  body.template-quickview .bp-acc {\n    display: none !important;\n  }\n\n  body:has(main[data-template='product.quickview']) main.content-for-layout {\n    padding-top: 0;\n    margin-top: 0;\n  }\n\n  /* PDP sticky add-to-cart bar (.bp-sticky-atc, z-index: 100) sits above\n     everything by design, but that also puts it above the mobile nav\n     drawer (bp-mobile-drawer, z-index ~5-6 off --layer-heightened) —\n     covering the bottom menu items when the drawer is open on a PDP.\n     Hide it for the duration instead of escalating the drawer's z-index,\n     which would ripple into every other component sharing that token. */\n  body:has(bp-mobile-drawer .bp-mobile-drawer__details[open]) .bp-sticky-atc {\n    display: none !important;\n  }\n\n  /* ============================================================\n     AB Tasty social-proof popup (\"POPULAR! N views in the last N days\",\n     injected at runtime via GTM/AB Tasty — .ab_widget_container_social-proof_*).\n     It was anchored to the left of the PDP gallery and overflowed the image\n     frame / got clipped at the viewport's left edge on wide monitors (QA 7/21).\n     Re-anchor it as a safe bottom-left toast so it stays fully on-screen at any\n     width and can't overlap the gallery. NOTE: the auto-dismiss timing (\"not\n     gone in a few seconds\") is an AB Tasty CAMPAIGN setting, not theme code.\n     ============================================================ */\n  .ab_widget_container_social-proof_content {\n    position: fixed !important;\n    left: 16px !important;\n    right: auto !important;\n    bottom: 16px !important;\n    top: auto !important;\n    transform: none !important;\n    max-width: min(320px, calc(100vw - 32px)) !important;\n    z-index: 30 !important;\n  }\n\n  /* ============================================================\n     Yotpo referral widget (instance 506320) — BP-controlled overrides.\n     These previously lived only in Yotpo's dashboard Custom CSS; kept here\n     so they're version-controlled and survive a Yotpo re-config. Renders on\n     the refer-a-friend page and the Proper Insider rewards page. Class names\n     are doubled to outrank Yotpo's runtime-injected single-class rules.\n     ============================================================ */\n  .yotpo-widget-referral-widget .yotpo-center-container.yotpo-center-container {\n    height: 626px;\n  }\n  /* Don't force the copy-code text white — keep it readable (BP text color)\n     against the widget's light surface. */\n  .yotpo-widget-referral-widget .yotpo-copy-text-button .yotpo-copy-text.yotpo-copy-text {\n    color: var(--bp-color-text) !important;\n  }\n\n  /* ============================================================\n     Cart-flyout (quick-add drawer) Add-to-bag button — match the PDP CTA.\n     The drawer's buy button is redistributed into .bp-qd__cta-slot, OUTSIDE\n     .product-information, so the PDP button rules (bp-pdp-styles) never reach\n     it — it came out mis-sized / stretched with no bag icon (QA: Amber).\n     Mirror the PDP spec: 17px / -0.17px / 500, filled black, 20px bag icon,\n     hover inverts. Icon = shared assets/bp-bag-icon.svg (white); hover uses\n     filter:brightness(0) to flip it black on the transparent button.\n     ============================================================ */\n  dialog.quick-add-modal.bp-qd add-to-cart-component button,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"],\n  dialog.quick-add-modal.bp-qd .buy-buttons button[type=\"submit\"] {\n    width: 100%;\n    background: var(--bp-color-text, #171609) !important;\n    color: var(--bp-color-cta-text, #FDFFFA) !important;\n    border: 1px solid var(--bp-color-text, #171609) !important;\n    border-radius: 0 !important;\n    padding: 16px 24px !important;\n    font-family: var(--bp-font-body) !important;\n    font-size: 17px !important;\n    font-weight: 500 !important;\n    line-height: normal !important;\n    letter-spacing: -0.17px !important;\n    text-transform: none !important;\n    display: inline-flex !important;\n    align-items: center !important;\n    justify-content: center !important;\n    gap: 10px !important;\n  }\n  dialog.quick-add-modal.bp-qd add-to-cart-component button .svg-wrapper.add-to-cart-icon,\n  dialog.quick-add-modal.bp-qd add-to-cart-component button .add-to-cart-icon,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"] .svg-wrapper.add-to-cart-icon,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"] .add-to-cart-icon {\n    display: none !important;\n  }\n  dialog.quick-add-modal.bp-qd add-to-cart-component button::after,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"]::after,\n  dialog.quick-add-modal.bp-qd .buy-buttons button[type=\"submit\"]::after {\n    content: '' !important;\n    display: inline-block !important;\n    flex: 0 0 20px !important;\n    width: 20px !important;\n    height: 20px !important;\n    background-repeat: no-repeat;\n    background-position: center;\n    background-size: contain;\n    background-image: url(//www.bostonproper.com/cdn/shop/t/1575/assets/bp-bag-icon.svg?v=5174825450042497821794251955);\n  }\n  dialog.quick-add-modal.bp-qd add-to-cart-component button:hover,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"]:hover,\n  dialog.quick-add-modal.bp-qd .buy-buttons button[type=\"submit\"]:hover,\n  dialog.quick-add-modal.bp-qd add-to-cart-component button:hover .add-to-cart-text,\n  dialog.quick-add-modal.bp-qd add-to-cart-component button:hover .add-to-cart-text *,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"]:hover .add-to-cart-text,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"]:hover .add-to-cart-text * {\n    background: transparent !important;\n    color: var(--bp-color-text, #171609) !important;\n  }\n  dialog.quick-add-modal.bp-qd add-to-cart-component button:hover::after,\n  dialog.quick-add-modal.bp-qd button[name=\"add\"]:hover::after,\n  dialog.quick-add-modal.bp-qd .buy-buttons button[type=\"submit\"]:hover::after {\n    filter: brightness(0);\n  }\n\n  /* ============================================================\n     Cart Shop Pay Installments logo → black (QA: Amber). Shopify's\n     native installments banner (the payment_terms filter in the\n     Horizon snippet cart-summary.liquid) injects a purple Shop Pay\n     wordmark as an img with id shoppay-installments-icon. BP wants it\n     black in the cart. filter:brightness(0) flattens the artwork to\n     solid black while preserving its transparency (same trick used on\n     the cart-flyout bag icon above). Scoped to .cart-totals__installments\n     so only the cart surfaces (drawer + cart page) are recoloured, not\n     any other Shop Pay mark.\n     ============================================================ */\n  .cart-totals__installments #shoppay-installments-icon {\n    filter: brightness(0) !important;\n  }\n\n  /* ============================================================\n     PLP Back-nav restore veil\n     bp-bloomreach.js adds html.bp-plp-restoring while a saved scroll\n     position is restored on a full-reload Back (PDP → Back → PLP), so the\n     shopper sees a brief loader instead of the grid painting at the TOP and\n     then jumping to their spot. Removed the instant the scroll lands (JS,\n     with a safety timeout). A bfcache Back never sets it, so that stays\n     instant. pointer-events:none so a real scroll/tap still passes through\n     and cancels the restore. Global (targets <html>) so it covers both the\n     /collections and /search PLPs, whose grid CSS lives in separate scoped\n     stylesheets.\n     ============================================================ */\n  .bp-plp-restore-veil {\n    position: fixed;\n    inset: 0;\n    z-index: 2147483000;\n    background: var(--bp-color-bg-page, #FEFFFA);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    pointer-events: none;\n    opacity: 1;\n    transition: opacity 0.4s ease;\n  }\n  /* Kill smooth-scroll while we pin the restore offset — Safari will\n     otherwise animate (and lose) competing scrollTo calls. */\n  html.bp-plp-restoring {\n    scroll-behavior: auto !important;\n  }\n  html.bp-plp-restoring body {\n    scroll-behavior: auto !important;\n  }\n  /* JS adds .is-out to fade the veil to 0, then removes the element once\n     faded — so it disappears SMOOTHLY, not \"de golpe\". */\n  .bp-plp-restore-veil.is-out { opacity: 0; }\n  .bp-plp-restore-veil__spin {\n    width: 34px;\n    height: 34px;\n    border-radius: 50%;\n    border: 3px solid rgba(23, 22, 9, 0.15);\n    border-top-color: var(--bp-color-text, #171609);\n    animation: bpPlpRestoreSpin 0.7s linear infinite;\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .bp-plp-restore-veil { transition: none; }\n    .bp-plp-restore-veil__spin { animation: none; }\n  }\n  @keyframes bpPlpRestoreSpin { to { transform: rotate(360deg); } }\n\n  /* ============================================================\n     PDP title de-flicker\n     Each colourway is a separate product whose Shopify title carries the\n     colour name; snippets/bp-pdp-title-color.liquid strips it (the colour is\n     already shown by the swatch). Server-side stripping isn't possible — the\n     title is a Text block bound to a  dynamic source — so hide the title\n     until the snippet strips it and marks it [data-bp-title-ready], so the full\n     \"…Colour\" title never flashes first. visibility:hidden keeps its box (no\n     CLS). A pure-CSS animation reveals it after 1.2s as a fail-safe, so it can\n     never get stuck hidden if the JS doesn't run.\n     ============================================================ */\n  .product-information h1:not([data-bp-title-ready]),\n  .product-details h1:not([data-bp-title-ready]) {\n    visibility: hidden;\n    animation: bpTitleRevealSafety 0s linear 1.2s forwards;\n  }\n  @keyframes bpTitleRevealSafety { to { visibility: visible; } }\n<\/style>\n<style id=\"dg-consent-custom-style\">\n  :host(.dg-consent-banner) {--dg-primary-font: var(--bp-font-body, 'Messina Sans VF', system-ui, sans-serif);\n    --dg-consent-background-border: #ffffff;\n    --consent-border-radius: 0;--dg-heading-font-size: 20px;\n    --dg-heading-font-weight: 500;--dg-explanation-font-size: 15px;\n    --dg-explanation-font-weight: 400;--dg-policy-option-heading-size: 15px;\n    --dg-policy-option-heading-weight: 500;\n    --dg-policy-option-descriptio lass=\"sizechart-colX\">37\"<\/td>\n<td class=\"sizechart-colX\">20\"<\/td>\n<\/tr>\n<tr>\n<td class=\"sizechart-colX\">At the knee<\/td>\n<td class=\"sizechart-colX\">38\" -39\"<\/td>\n<td class=\"sizechart-colX\">22\"<\/td>\n<\/tr>\n<tr>\n<td class=\"sizechart-colX\">Below the knee<\/td>\n<td class=\"sizechart-colX\">40\" - 41\"<\/td>\n<td class=\"sizechart-colX\">23\" - 24\"<\/td>\n<\/tr>\n<tr>\n<td class=\"sizechart-colX\">Midi<\/td>\n<td class=\"sizechart-colX\">44\" - 45\"<\/td>\n<td class=\"sizechart-colX\">28\"<\/td>\n<\/tr>\n<tr>\n<td class=\"sizechart-colX\">Ankle<\/td>\n<td class=\"sizechart-colX\">54\" - 55\"<\/td>\n<td class=\"sizechart-colX\">38\"<\/td>\n<\/tr>\n<tr>\n<td class=\"sizechart-colX\">Maxi<\/td>\n<td class=\"sizechart-colX\">57\" - 58\"<\/td>\n<td class=\"sizechart-colX\">40\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<\/div>\n<div style=\"display: none;\" class=\"modal-measuring\">\n<div>\n<div class=\"flex-measuring-text\" style=\"margin-top: 0px;\">\n<h4>Measuring For The Perfect Size<\/h4>\n<p class=\"flex-measuring-text-center\">Wearing appropriate undergarments, place the measuring tape comfortably around the bust, waist and hips. To determine the most accurate measurements, ensure that the tape is placed evenly around and parallel to the floor.<\/p>\n<\/div>\n<div class=\"flex-measuring\">\n<div class=\"customerservice--sizecharts-model\"><img src=\"https://media.bostonproper.com/i/bostonproper/silhouette_v2-01?w=600\" alt=\"Model wearing a white tank top and blue jeans.\"><\/div>\n<div>\n<ul>\n<li>\n<strong>Bust:<\/strong> Measure around the fullest part of the bust, arms relaxed at your side.<\/li>\n<li>\n<strong>Waist:<\/strong> Measure around waist smallest point with tape slightly loosened for comfort.<\/li>\n<li>\n<strong>Hips:<\/strong> With feet together, measure around the fullest part of hip and rear, usually 7\" - 9\" below the waist.<\/li>\n<li>\n<strong>Inseam:<\/strong> Measure a similar style of pants that fit well. Measure from the crotch seam to the hem.<\/li>\n<li>\n<strong>Length:<\/strong> Lengths are measured at the front, starting from where the shoulder meets the neck.<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div>\n<p>For additional information, please click on full sizing details below or contact the Customer Care team with any questions you may have.<\/p>\n<\/div>\n<div class=\"richtext-cta-container richtext-cta-container--small\">\n<div class=\"richtext-cta-container\">\n<a style=\"margin-right: 20px;\" href=\"https://www.bostonproper.com/pages/size-chart\" class=\"button button--secondary richtext-cta__button\"><em class=\"blog-title\"><b>Full a SIZING DETAILS<\/b><\/em><\/a> <a href=\"https://www.bostonproper.com/pages/contact-us\" class=\"button button--secondary richtext-cta__button\"><em class=\"blog-title\"><b>CONTACT CUSTOMER CARE<\/b><\/em><\/a>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n <section id=\"bp-size-chart-pane-htm\" class=\"bp-size-chart__pane bp-size-chart__pane--htm\" role=\"tabpanel\" data-bp-size-chart-pane=\"htm\"><figure class=\"bp-size-chart__measure-fig\">\n <img class=\"bp-size-chart__measure-img\" src=\"https://www.bostonproper.com/cdn/shop/t/1567/assets/bp-size-chart-measure.png?v=70142022341375340491793637101\" alt=\"Measurement diagram showing bust, waist, hips, and inseam points on a model\">\n <\/figure><h3>Measuring for the Perfect Size<\/h3>\n<p>Wearing a bra and panties, place the measuring tape comfortably around the bust, waist and hips. To determine the most accurate measurements, ensure that the tape is placed evenly around and parallel to the floor.<\/p>\n<ul>\n<li>\n<strong>Bust:<\/strong> Measure around the fullest part of the bust, arms relaxed at your side.<\/li>\n<li>\n<strong>Waist:<\/strong> Measure around waist smallest point with tape slightly loosened for comfort.<\/li>\n<li>\n<strong>Hips:<\/strong> With feet together, measure around the fullest part of hip and rear, usually 7\" - 9\" below the waist.<\/li>\n<li>\n<strong>Inseam:<\/strong> Measure a similar style of pants that fit well. Measure from the crotch seam to the hem.<\/li>\n<li>\n<strong>Length:<\/strong> Lengths are measured at the front, starting from where the shoulder meets the neck.<\/li>\n<\/ul>\n<p><a class=\"btn\" href=\"https://www.bostonproper.com/pages/size-chart\">Full Sizing Details<\/a><\/p>\n<p><a class=\"btn\" href=\"https://www.bostonproper.com/pages/contact-us\">Contact Customer Care<\/a><\/p>\n<\/section>\n <\/div>\n <\/div>\n <\/dialog>\n <dialog class=\"bp-notify\" id=\"bp-notify-drawer\" data-bp-notify-drawer=\"\" data-klaviyo-company=\"VZrTML\" data-klaviyo-company-dev=\"WgMT43\" data-klaviyo-list=\"WFEsDC\" data-klaviyo-list-dev=\"VDxyUk\" aria-labelledby=\"bp-notify-title\">\n <form class=\"bp-notify__inner\" data-bp-notify-form=\"\">\n <button type=\"button\" class=\"bp-notify__close\" data-bp-notify-close=\"\" aria-label=\"Close\">\n <svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n <line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\/line>\n <line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\/line>\n <\/svg>\n <\/button><div class=\"bp-notify__body\" data-bp-notify-state=\"form\">\n <h2 id=\"bp-notify-title\" class=\"bp-notify__title\">Join the Waitlist<\/h2>\n <p class=\"bp-notify__copy\">Be first in line if your size makes a comeback.<\/p>\n <label class=\"bp-notify__field\">\n <span class=\"bp-notify__label\">Email address<\/span>\n <input type=\"email\" required=\"\" autocomplete=\"email\" data-bp-notify-email=\"\" id=\"bp-notify-email\" aria-describedby=\"bp-notify-error\">\n <\/label>\n <label class=\"bp-notify__opt\">\n <input type=\"checkbox\" data-bp-notify-optin=\"\">\n <span>Add me to your email list.<\/span>\n <\/label>\n <button type=\"submit\" class=\"bp-notify__submit\" data-bp-notify-submit=\"\">\n Notify me when it's back\n <\/button>\n <p
