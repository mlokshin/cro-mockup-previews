<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boston Proper - Control vs Variant</title><style>body{margin:0;font:14px system-ui,sans-serif;background:#f4f4f5;color:#18181b}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid #e4e4e7}button{padding:6px 14px;border:1px solid #d4d4d8;border-radius:6px;background:#fff;cursor:pointer;font:inherit}button.on{background:#18181b;color:#fff;border-color:#18181b}.wrap{display:flex;gap:16px;padding:16px;justify-content:center;align-items:flex-start}.lbl{font-weight:600;margin:0 0 6px}.frame{overflow:hidden;background:#fff;border:1px solid #d4d4d8}iframe{border:0;transform-origin:0 0;display:block}</style></head><body><header><strong>Boston Proper</strong><button id="bd" class="on">Desktop</button><button id="bm">Mobile</button></header><div class="wrap"><div><p class="lbl">Control (live page, unchanged)</p><div class="frame" id="f1"><iframe id="c" src="control.html"></iframe></div></div><div><p class="lbl">Variant</p><div class="frame" id="f2"><iframe id="v" src="variant.html"></iframe></div></div></div><script>var W=1440,H=900;function layout(){var avail=(window.innerWidth-48)/2;var s=Math.min(1,avail/W);["c","v"].forEach(function(id){var f=document.getElementById(id);f.style.width=W+"px";f.style.height=H+"px";f.style.transform="scale("+s+")";});["f1","f2"].forEach(function(id){var f=document.getElementById(id);f.style.width=(W*s)+"px";f.style.height=(H*s)+"px";});}function set(w,h,on,off){W=w;H=h;document.getElementById(on).className="on";document.getElementById(off).className="";layout();}document.getElementById("bd").onclick=function(){set(1440,900,"bd","bm");};document.getElementById("bm").onclick=function(){set(390,844,"bm","bd");};window.onresize=layout;layout();</script></body></html>
